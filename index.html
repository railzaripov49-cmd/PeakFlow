<!-- ================= НАЧАЛО КОДА (ВЕРСИЯ 11.0 - LIQUID GLASS & MORPHING) ================= -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <style>
        /* =========================================
           ГЛОБАЛЬНЫЕ СТИЛИ И ЦВЕТА
           ========================================= */
        :root {
            --bg: #050505;
            --text: #ffffff;
            --text-secondary: #8E8E93;
            --blue: #0A84FF;
            --green: #30D158;
            --red: #FF453A;
            --glass: rgba(30, 30, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            
            /* Кривая пружины для анимаций (iOS Spring) */
            --spring: cubic-bezier(0.32, 0.72, 0, 1);
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px; overflow: hidden; height: 100vh; box-sizing: border-box;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; 
        }

        /* --- ЯДРО (ФОН) --- */
        #core {
            position: fixed; top: 50%; left: 50%; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%; transform: translate(-50%, -50%) scale(1);
            z-index: 0; pointer-events: none;
            transition: transform 1.5s ease-in-out, opacity 1.5s ease-in-out;
        }

        /* =========================================
           ЭКРАНЫ (КАЛЕНДАРЬ И ГРАФИК)
           ========================================= */
        .view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s; 
            padding: 20px; box-sizing: border-box; z-index: 1;
        }
        .view.active { opacity: 1; pointer-events: auto; z-index: 10; }

        /* Шапка */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header button { 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text); font-size: 18px; width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
        }
        .header button:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }

        /* Календарь */
        .weekdays { 
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; 
            font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); font-size: 13px; 
            flex-shrink: 0;
        }
        .weekends { color: var(--red); }
        
        .calendar { 
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; 
            align-content: start; 
        }

        /* Ячейки календаря (Liquid Glass) */
        .day-cell { 
            aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 16px; position: relative; cursor: pointer;
            
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.1);
            
            transition: transform 0.1s var(--spring), background 0.2s;
        }
        .day-cell:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
        .day-cell.today { 
            background: rgba(10, 132, 255, 0.3); 
            border-top: 1px solid rgba(10, 132, 255, 0.5);
            border-left: 1px solid rgba(10, 132, 255, 0.3);
        }
        
        .day-num { font-size: 17px; font-weight: 500; color: var(--text); }
        .day-val { font-size: 10px; font-weight: 600; position: absolute; bottom: 5px; }
        
        .val-green { color: var(--green); }
        .val-blue { color: var(--blue); }
        .day-cell.today .day-val { color: rgba(255,255,255,0.9); }

        .empty-cell { background: transparent; border: none; box-shadow: none; cursor: default; }
        .empty-cell:active { transform: none; background: transparent; }

        /* =========================================
           FAB МЕНЮ (МОРФИНГ)
           ========================================= */
        #fabContainer {
            position: fixed; bottom: 30px; left: 20px;
            width: 56px; height: 56px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            border-radius: 28px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            /* Пружинная анимация расширения */
            transition: width 0.4s var(--spring), height 0.4s var(--spring), border-radius 0.4s var(--spring);
            z-index: 500; overflow: hidden; cursor: pointer;
        }
        
        #fabContainer.expanded {
            width: 120px; height: 110px; border-radius: 24px;
            background: rgba(30, 30, 30, 0.85);
            cursor: default;
        }

        .fab-plus { 
            position: absolute; font-size: 32px; font-weight: 300; color: white; 
            transition: opacity 0.2s, transform 0.3s var(--spring); 
        }
        #fabContainer.expanded .fab-plus { opacity: 0; transform: rotate(45deg) scale(0.5); pointer-events: none; }

        .fab-menu-content {
            display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 12px; box-sizing: border-box;
            opacity: 0; pointer-events: none; transform: scale(0.8) translateY(10px);
            transition: opacity 0.2s, transform 0.4s var(--spring);
        }
        
        #fabContainer.expanded .fab-menu-content { 
            opacity: 1; pointer-events: auto; 
            transform: scale(1) translateY(0); transition-delay: 0.05s; 
        }

        .fab-action-btn {
            background: rgba(255,255,255,0.08); border: none; padding: 10px 14px; border-radius: 12px; color: white;
            display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500;
            cursor: pointer; transition: background 0.2s, transform 0.1s; width: 100%;
        }
        .fab-action-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.96); }

        /* =========================================
           МОДАЛЬНОЕ ОКНО (МОРФИНГ ИЗ ЯЧЕЙКИ)
           ========================================= */
        #expandedView { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; 
            pointer-events: none; opacity: 0; transition: opacity 0.3s; 
            display: flex; justify-content: center; align-items: center;
        }
        
        /* Подложка затемняется и размывается */
        #expandedView::before { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            opacity: 0; transition: opacity 0.3s; 
        }
        
        #modalContent {
            position: absolute;
            top: 10vh; bottom: 10vh; left: 20px; right: 20px;
            
            /* Само стекло */
            background: var(--glass);
            backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
            border-radius: 24px; 
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow: hidden;
            
            /* Начальное состояние (сжато в точку, координаты задаст JS) */
            clip-path: inset(50% 50% 50% 50% round 16px); 
            transition: clip-path 0.6s var(--spring);
            will-change: clip-path;
            transform: translateZ(0); /* Аппаратное ускорение */
        }
        
        #expandedView.active { pointer-events: auto; opacity: 1; }
        #expandedView.active::before { opacity: 1; }
        
        .expanded-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
        .expanded-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
        .close-btn { 
            background: rgba(255,255,255,0.1); border: none; color: var(--text); 
            font-size: 18px; width: 30px; height: 30px; border-radius: 50%; 
            cursor: pointer; display: flex; justify-content: center; align-items: center; transition: background 0.2s;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .close-btn:active { background: rgba(255,255,255,0.2); }
        
        #measurementList { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; 
            -webkit-overflow-scrolling: touch; scrollbar-width: none; 
        }
        #measurementList::-webkit-scrollbar { display: none; }
        
        /* Строки в списке */
        .measurement-item { 
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; 
            flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .m-time { color: var(--text-secondary); font-size: 15px; font-weight: 500; }
        .m-value { font-size: 17px; font-weight: 600; }

        /* Месячный график */
        .chart-container { 
            flex: 1; position: relative; width: 100%; height: 100%; 
            background: rgba(28, 28, 30, 0.6); border-radius: 20px; padding: 15px; 
            box-sizing: border-box; border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <div id="core"></div>

    <!-- КАЛЕНДАРЬ -->
    <div id="calendarView" class="view active">
        <div class="header">
            <button id="prevBtn">&#8249;</button>
            <span id="monthTitle"></span>
            <button id="nextBtn">&#8250;</button>
        </div>
        <div class="weekdays">
            <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div class="weekends">СБ</div><div class="weekends">ВС</div>
        </div>
        <div class="calendar" id="calendarGrid"></div>
    </div>

    <!-- МЕСЯЧНЫЙ ГРАФИК -->
    <div id="graphView" class="view">
        <div class="header">
            <button id="prevMonthGraph">&#8249;</button>
            <span id="monthTitleGraph"></span>
            <button id="nextMonthGraph">&#8250;</button>
        </div>
        <div class="chart-container">
            <canvas id="monthlyChart"></canvas>
        </div>
    </div>

    <!-- FAB МЕНЮ -->
    <div id="fabContainer" onclick="toggleFab(event)">
        <div class="fab-plus">+</div>
        <div class="fab-menu-content">
            <button class="fab-action-btn" onclick="switchToView('graph', event)">📈 График</button>
            <button class="fab-action-btn" onclick="switchToView('calendar', event)">📅 Календарь</button>
        </div>
    </div>

    <!-- МОДАЛКА (СПИСОК) -->
    <div id="expandedView" onclick="closeExpandedView()">
        <div id="modalContent" onclick="event.stopPropagation()">
            <div class="expanded-header">
                <div class="expanded-title" id="sheetDateTitle">Дата</div>
                <button class="close-btn" onclick="closeExpandedView()">×</button>
            </div>
            <div id="measurementList"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxh0Poo3SwCP1-2wyQtV5BfGbxvOTKG012sbCPbNlRe-ay82MaTmHbT1ComA1CXT3Wv_Q/exec";

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let allData = {}; 
        let monthlyChartInstance = null;
        let currentView = 'calendar';

        const core = document.getElementById('core');
        setInterval(() => {
            const scale = 0.9 + Math.random() * 0.15;
            const opacity = 0.5 + Math.random() * 0.2;
            core.style.transform = `translate(-50%, -50%) scale(${scale})`;
            core.style.opacity = opacity;
        }, 3000);

        function toggleFab(e) {
            if (e.target.id === 'fabContainer' || e.target.classList.contains('fab-plus')) {
                document.getElementById('fabContainer').classList.toggle('expanded');
            }
        }

        document.addEventListener('click', function(event) {
            const fab = document.getElementById('fabContainer');
            if (fab.classList.contains('expanded') && !fab.contains(event.target)) {
                fab.classList.remove('expanded');
            }
        });

        function switchToView(target, e) {
            if(e) e.stopPropagation(); 
            document.getElementById('fabContainer').classList.remove('expanded');
            if (currentView === target) return;

            const calView = document.getElementById('calendarView');
            const grView = document.getElementById('graphView');

            if (target === 'graph') {
                calView.classList.remove('active');
                grView.classList.add('active');
                currentView = 'graph';
                renderMonthlyGraph();
            } else {
                grView.classList.remove('active');
                calView.classList.add('active');
                currentView = 'calendar';
            }
        }

        async function loadData() {
            try {
                const response = await fetch(scriptUrl + "?action=getData");
                const data = await response.json(); 
                for (let i = 1; i < data.length; i++) {
                    const dateObj = new Date(data[i][0]); 
                    const flow = parseFloat(data[i][1]); 
                    if (isNaN(flow)) continue; 
                    
                    const dateKey = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
                    const timeStr = String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0') + ':' + String(dateObj.getSeconds()).padStart(2, '0');
                    const hour = dateObj.getHours();
                    
                    if (!allData[dateKey]) allData[dateKey] = [];
                    allData[dateKey].push({ time: timeStr, flow: flow, hour: hour });
                }
                renderCalendar();
            } catch (error) {
                console.error("Ошибка загрузки", error);
            }
        }

        function renderCalendar() {
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('monthTitle').innerText = monthNames[currentMonth] + " " + currentYear;
            document.getElementById('monthTitleGraph').innerText = monthNames[currentMonth] + " " + currentYear;
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = ''; 
            let firstDay = new Date(currentYear, currentMonth, 1).getDay();
            let startDay = firstDay === 0 ? 7 : firstDay; 
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            for (let i = 1; i < startDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day-cell empty-cell';
                grid.appendChild(emptyDiv);
            }
            
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) cell.classList.add('today');
                
                const dateKey = currentYear + '-' + String(currentMonth+1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const measurements = allData[dateKey] || [];
                
                if (measurements.length > 0) {
                    const maxFlow = Math.max(...measurements.map(m => m.flow));
                    const colorClass = maxFlow <= 12 ? 'val-green' : 'val-blue';
                    cell.innerHTML = `<span class="day-num">${day}</span><span class="day-val ${colorClass}">${maxFlow.toFixed(1)}</span>`;
                } else {
                    cell.innerHTML = `<span class="day-num">${day}</span>`;
                }
                
                cell.addEventListener('click', function() { openModal(this, day, measurements); });
                grid.appendChild(cell);
            }
        }

        function renderMonthlyGraph() {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            let labels = [];
            let morningData = [];
            let eveningData = [];

            for (let day = 1; day <= daysInMonth; day++) {
                labels.push(day);
                const dateKey = currentYear + '-' + String(currentMonth+1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const measurements = allData[dateKey];
                
                if (measurements && measurements.length > 0) {
                    const morning = measurements.filter(m => m.hour < 12);
                    const evening = measurements.filter(m => m.hour >= 12);
                    morningData.push(morning.length > 0 ? Math.max(...morning.map(m => m.flow)) : null);
                    eveningData.push(evening.length > 0 ? Math.max(...evening.map(m => m.flow)) : null);
                } else {
                    morningData.push(null);
                    eveningData.push(null);
                }
            }

            if (monthlyChartInstance) monthlyChartInstance.destroy();

            monthlyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Утро',
                            data: morningData,
                            borderColor: '#30D158',
                            backgroundColor: 'rgba(48, 209, 88, 0.1)',
                            borderWidth: 3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#30D158',
                            tension: 0.4,
                            spanGaps: true,
                            fill: false
                        },
                        {
                            label: 'День/Вечер',
                            data: eveningData,
                            borderColor: '#0A84FF',
                            backgroundColor: 'rgba(10, 132, 255, 0.1)',
                            borderWidth: 3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#0A84FF',
                            tension: 0.4,
                            spanGaps: true,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: true, labels: { color: '#8E8E93' } } },
                    scales: {
                        x: { ticks: { color: '#8E8E93', stepSize: 1, autoSkip: false, maxRotation: 90, minRotation: 90 }, grid: { display: false } },
                        y: { min: 0, max: 1000, ticks: { color: '#8E8E93', stepSize: 50 }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        // --- АНИМАЦИЯ МОРФИНГА (УВЕЛИЧЕНИЕ ИЗ ЯЧЕЙКИ) ---
        function openModal(cell, day, measurements) {
            const monthNames = ["Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"];
            document.getElementById('sheetDateTitle').innerText = `${day} ${monthNames[currentMonth]}`;
            
            const list = document.getElementById('measurementList');
            list.innerHTML = ''; 
            
            if (measurements.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#8E8E93; margin-top:20px; font-size:15px;">Нет данных</div>`;
            } else {
                measurements.sort((a, b) => a.time.localeCompare(b.time));
                measurements.forEach((m) => {
                    const item = document.createElement('div');
                    item.className = 'measurement-item';
                    const colorClass = m.flow <= 12 ? 'val-green' : 'val-blue';
                    item.innerHTML = `<span class="m-time">🕒 ${m.time}</span><span class="m-value ${colorClass}">${m.flow.toFixed(2)} л/м</span>`;
                    list.appendChild(item);
                });
            }

            const rect = cell.getBoundingClientRect();
            const modal = document.getElementById('modalContent');
            const view = document.getElementById('expandedView');
            
            // Вычисляем стартовые координаты (где находится ячейка)
            const modalRect = modal.getBoundingClientRect();
            const insetTop = rect.top - modalRect.top;
            const insetBottom = modalRect.bottom - rect.bottom;
            const insetLeft = rect.left - modalRect.left;
            const insetRight = modalRect.right - rect.right;
            
            // 1. Мгновенно ставим окно в размер ячейки (без анимации)
            modal.style.transition = 'none';
            modal.style.clipPath = `inset(${insetTop}px ${insetRight}px ${insetBottom}px ${insetLeft}px round 16px)`;
            
            view.classList.add('active');
            
            // 2. Форсируем перерисовку кадра
            void modal.offsetHeight;
            
            // 3. Включаем пружинную анимацию и растягиваем на весь экран
            setTimeout(() => {
                modal.style.transition = 'clip-path 0.6s var(--spring)';
                modal.style.clipPath = `inset(0px 0px 0px 0px round 24px)`; 
            }, 10);
        }

        function closeExpandedView() {
            const view = document.getElementById('expandedView');
            view.classList.remove('active');
        }

        document.getElementById('prevBtn').addEventListener('click', () => { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); });
        document.getElementById('nextBtn').addEventListener('click', () => { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); });
        document.getElementById('prevMonthGraph').addEventListener('click', () => { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); renderMonthlyGraph(); });
        document.getElementById('nextMonthGraph').addEventListener('click', () => { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); renderMonthlyGraph(); });

        loadData();
    </script>
</body>
</html>
<!-- ================= КОНЕЦ КОДА (ВЕРСИЯ 11.0) =================== -->
