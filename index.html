<!-- ================= НАЧАЛО КОДА (ВЕРСИЯ 15.7 - CLEAR GRAPH POINTS + GLOBAL ASTHMA STATE SYNC) ================= -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <style>
        :root {
            --bg: #030408;
            --text: #ffffff;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --blue: #0A84FF;
            --green: #30D158;
            --orange: #FF9F0A;
            --red: #FF453A;
            --spring: cubic-bezier(0.22, 1, 0.36, 1);
            --spring-gooey: cubic-bezier(0.34, 1.42, 0.64, 1);
        }

        * {
            touch-action: manipulation;
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px; overflow: hidden; height: 100vh; box-sizing: border-box;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; 
        }

        #hzAnchor {
            position: fixed; top: 0; left: 0; width: 1px; height: 1px;
            opacity: 0.01; pointer-events: none; z-index: -1;
            will-change: transform;
        }

        .ambient-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            contain: strict;
        }
        .liquid-blob {
            position: absolute; border-radius: 50%;
            will-change: transform;
            transform: translate3d(0,0,0);
            backface-visibility: hidden;
        }
        .blob-1 {
            top: -4%; left: -10%; width: 460px; height: 460px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.42) 0%, rgba(56, 189, 248, 0.14) 42%, transparent 72%);
            animation: floatBlob1 10s ease-in-out infinite alternate;
        }
        .blob-2 {
            top: 32%; right: -14%; width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(48, 209, 88, 0.3) 0%, rgba(16, 185, 129, 0.08) 45%, transparent 72%);
            animation: floatBlob2 12s ease-in-out infinite alternate;
        }
        .blob-3 {
            bottom: -8%; left: 4%; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(94, 92, 230, 0.38) 0%, rgba(168, 85, 247, 0.1) 46%, transparent 72%);
            animation: floatBlob3 14s ease-in-out infinite alternate;
        }

        @keyframes floatBlob1 {
            0% { transform: translate3d(0, 0, 0) scale3d(0.92, 0.92, 1); }
            100% { transform: translate3d(22%, 18%, 0) scale3d(1.16, 1.16, 1); }
        }
        @keyframes floatBlob2 {
            0% { transform: translate3d(0, -14%, 0) scale3d(1.1, 1.1, 1); }
            100% { transform: translate3d(-22%, 15%, 0) scale3d(0.88, 0.88, 1); }
        }
        @keyframes floatBlob3 {
            0% { transform: translate3d(-14%, 8%, 0) scale3d(1, 1, 1); }
            100% { transform: translate3d(20%, -18%, 0) scale3d(1.15, 1.15, 1); }
        }

        .view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; pointer-events: none; 
            transform-origin: 48px calc(100% - 58px);
            transform: scale3d(0.18, 0.18, 1);
            border-radius: 80px;
            transition: opacity 0.26s var(--spring), transform 0.44s var(--spring), border-radius 0.42s var(--spring); 
            padding: 20px; box-sizing: border-box; z-index: 1;
            contain: layout style;
            backface-visibility: hidden;
        }
        .view.animating {
            will-change: opacity, transform;
        }
        .view.active { 
            opacity: 1; pointer-events: auto; z-index: 10; 
            transform: scale3d(1, 1, 1);
            border-radius: 0px;
        }

        #dayView {
            overflow-y: auto;
            padding-bottom: 115px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            contain: content;
        }
        #dayView::-webkit-scrollbar { display: none; }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header button { 
            position: relative;
            background: 
                radial-gradient(130% 100% at 30% 15%, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.03) 68%),
                rgba(26, 28, 38, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 22px rgba(0,0,0,0.38), inset 0 1px 12px rgba(255,255,255,0.16);
            color: var(--text); font-size: 18px; width: 42px; height: 42px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; 
            transition: background 0.16s, transform 0.34s var(--spring-gooey);
        }
        .header button:active { 
            background: rgba(255,255,255,0.26); 
            transform: scale3d(0.78, 0.78, 1); 
        }

        .header .refresh-glass-btn {
            width: auto; height: 36px; border-radius: 18px; padding: 0 14px;
            font-size: 14px; font-weight: 600; color: #64D2FF;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .refresh-icon {
            display: inline-block;
            transition: transform 0.52s var(--spring);
        }
        .refresh-glass-btn.spinning .refresh-icon {
            transform: rotate(360deg);
        }

        .weekdays { 
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; 
            font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); font-size: 12px; 
            flex-shrink: 0;
        }
        .weekends { color: var(--red); }
        
        .calendar { 
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; 
            align-content: start; 
        }

        @keyframes liquidDropIn {
            0% { opacity: 0; transform: scale3d(0.74, 0.74, 1); }
            100% { opacity: 1; transform: scale3d(1, 1, 1); }
        }

        .day-cell { 
            aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 20px; position: relative; cursor: pointer; overflow: hidden;
            
            background: 
                radial-gradient(140% 95% at 30% 10%, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.02) 58%, transparent 100%),
                radial-gradient(110% 80% at 75% 95%, rgba(100, 180, 255, 0.1) 0%, transparent 65%),
                rgba(22, 25, 34, 0.64);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.34),
                inset 0 2px 14px rgba(255, 255, 255, 0.1);
            
            animation: liquidDropIn 0.38s var(--spring) backwards;
            transition: transform 0.3s var(--spring-gooey), background 0.18s;
            backface-visibility: hidden;
        }
        .day-cell:not(.morphing-cell):active { 
            transform: scale3d(0.86, 0.86, 1); 
        }

        .day-cell.has-data {
            background: 
                radial-gradient(140% 95% at 30% 10%, rgba(255, 255, 255, 0.24) 0%, rgba(48, 209, 88, 0.12) 60%, transparent 100%),
                rgba(24, 30, 38, 0.74);
            border-color: rgba(255, 255, 255, 0.16);
        }

        /* Индикатор дня с отдышкой на ячейке календаря */
        .day-cell.has-dyspnea {
            border-color: rgba(255, 69, 58, 0.45);
        }
        .day-dyspnea-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 8px var(--red);
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .day-cell.morphing-cell.is-open .day-dyspnea-dot {
            opacity: 0;
        }
        
        .day-cell.today { 
            background: 
                radial-gradient(140% 100% at 25% 10%, rgba(255, 255, 255, 0.34) 0%, rgba(10, 132, 255, 0.42) 55%, rgba(94, 92, 230, 0.32) 100%),
                rgba(16, 48, 98, 0.8);
            border-color: rgba(120, 190, 255, 0.34);
            box-shadow: 0 12px 26px rgba(10, 132, 255, 0.4), inset 0 2px 16px rgba(255,255,255,0.26);
        }
        
        .day-num { 
            font-size: 17px; font-weight: 600; color: var(--text); pointer-events: none;
            transition: opacity 0.15s ease, transform 0.26s var(--spring);
        }
        .day-val { 
            font-size: 10px; font-weight: 700; position: absolute; bottom: 5px; pointer-events: none;
            transition: opacity 0.15s ease, transform 0.26s var(--spring);
        }
        
        .val-green { color: var(--green); }
        .val-blue { color: #64D2FF; }
        .day-cell.today .day-val { color: #ffffff; }

        .empty-cell { background: transparent; border: none; box-shadow: none; cursor: default; animation: none; pointer-events: none; }

        .day-cell-placeholder {
            aspect-ratio: 1 / 1;
            visibility: hidden;
            pointer-events: none;
        }

        .day-cell.morphing-cell {
            position: fixed !important;
            top: 8vh !important;
            left: 18px !important;
            width: calc(100vw - 36px) !important;
            height: 84vh !important;
            aspect-ratio: auto !important;
            border-radius: 30px !important;
            animation: none !important;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding: 20px;
            box-sizing: border-box;
            cursor: default;
            transform-origin: 0 0;
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.03) 60%, transparent 100%),
                rgba(18, 21, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 36px 72px rgba(0,0,0,0.78), inset 0 2px 20px rgba(255,255,255,0.18);
            will-change: transform;
            backface-visibility: hidden;
        }
        .day-cell.morphing-cell.is-open .day-num,
        .day-cell.morphing-cell.is-open .day-val {
            opacity: 0;
            transform: scale3d(0.7, 0.7, 1);
        }

        #modalBackdrop {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(2, 4, 10, 0.66);
            opacity: 0; pointer-events: none;
            transition: opacity 0.28s var(--spring);
        }
        #modalBackdrop.active {
            opacity: 1; pointer-events: auto;
        }

        .cell-modal-inner {
            display: flex; flex-direction: column; height: 100%; min-height: 0; width: 100%;
            opacity: 0;
            transform: scale3d(0.95, 0.95, 1);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.32s var(--spring);
        }
        .day-cell.morphing-cell.is-open .cell-modal-inner {
            opacity: 1;
            transform: scale3d(1, 1, 1);
            pointer-events: auto;
            transition-delay: 0.07s;
        }

        .expanded-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-shrink: 0; }
        .expanded-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); white-space: nowrap; }
        .close-btn { 
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); color: var(--text); 
            font-size: 18px; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            cursor: pointer; display: flex; justify-content: center; align-items: center; 
            transition: background 0.16s, transform 0.32s var(--spring-gooey);
            box-shadow: inset 0 1px 10px rgba(255,255,255,0.16);
        }
        .close-btn:active { background: rgba(255,255,255,0.28); transform: scale3d(0.78, 0.78, 1) rotate(90deg); }

        #measurementList { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; 
            -webkit-overflow-scrolling: touch; scrollbar-width: none; 
            contain: content;
        }
        #measurementList::-webkit-scrollbar { display: none; }

        @keyframes liquidCardRise {
            0% { opacity: 0; transform: scale3d(0.94, 0.94, 1); }
            100% { opacity: 1; transform: scale3d(1, 1, 1); }
        }

        .glass-card, .stat-box {
            position: relative;
            overflow: hidden;
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 58%, transparent 100%),
                radial-gradient(110% 70% at 85% 100%, rgba(10, 132, 255, 0.08) 0%, transparent 65%),
                rgba(20, 23, 32, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: 
                0 16px 34px rgba(0, 0, 0, 0.44),
                inset 0 2px 18px rgba(255, 255, 255, 0.1);
            transition: transform 0.32s var(--spring-gooey), background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease;
        }
        .glass-card:not(.hero-card):active, .stat-box:active {
            transform: scale3d(0.97, 0.97, 1);
        }

        .hero-card.state-dyspnea {
            background: 
                radial-gradient(140% 100% at 20% 0%, rgba(255, 69, 58, 0.36) 0%, rgba(255, 69, 58, 0.08) 58%, transparent 100%),
                radial-gradient(120% 80% at 90% 100%, rgba(255, 159, 10, 0.16) 0%, transparent 65%),
                rgba(38, 18, 22, 0.82);
            border-color: rgba(255, 95, 85, 0.36);
            box-shadow: 0 18px 38px rgba(255, 69, 58, 0.18), inset 0 2px 18px rgba(255, 130, 120, 0.14);
        }
        .hero-card.state-normal {
            background: 
                radial-gradient(140% 100% at 20% 0%, rgba(48, 209, 88, 0.32) 0%, rgba(48, 209, 88, 0.06) 58%, transparent 100%),
                radial-gradient(120% 80% at 90% 100%, rgba(10, 132, 255, 0.14) 0%, transparent 65%),
                rgba(18, 34, 26, 0.8);
            border-color: rgba(48, 209, 88, 0.34);
            box-shadow: 0 18px 38px rgba(48, 209, 88, 0.15), inset 0 2px 18px rgba(120, 255, 160, 0.14);
        }

        .glass-card {
            border-radius: 26px;
            padding: 16px;
            margin-bottom: 14px;
        }

        #dayView.active .anim-stagger-1 { animation: liquidCardRise 0.38s var(--spring) 0.03s backwards; }
        #dayView.active .anim-stagger-2 { animation: liquidCardRise 0.38s var(--spring) 0.06s backwards; }
        #dayView.active .anim-stagger-3 { animation: liquidCardRise 0.38s var(--spring) 0.09s backwards; }
        #dayView.active .anim-stagger-4 { animation: liquidCardRise 0.38s var(--spring) 0.12s backwards; }
        #dayView.active .anim-stagger-5 { animation: liquidCardRise 0.38s var(--spring) 0.15s backwards; }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-secondary);
        }

        .card-sub-hint {
            font-size: 11px; color: var(--text-secondary); font-weight: 500;
        }

        .glass-badge {
            font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
            box-shadow: inset 0 1px 10px rgba(255,255,255,0.16);
            transition: background 0.28s ease, color 0.28s ease, transform 0.36s var(--spring-gooey);
        }
        .glass-badge.pulse { transform: scale3d(1.14, 1.14, 1); }
        .zone-green { background: rgba(48, 209, 88, 0.24); color: var(--green); }
        .zone-orange { background: rgba(255, 159, 10, 0.24); color: var(--orange); }
        .zone-red { background: rgba(255, 69, 58, 0.24); color: var(--red); }

        .hero-row {
            display: flex; align-items: baseline; gap: 6px; margin: 4px 0 8px;
        }
        .hero-value {
            font-size: 48px; font-weight: 700; letter-spacing: -1.5px; line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .hero-unit {
            font-size: 16px; font-weight: 500; color: var(--text-secondary);
        }
        .hero-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 32px;
        }
        .hero-meta {
            font-size: 13px; color: var(--text-secondary);
            white-space: nowrap;
        }

        .asthma-morph-pill {
            position: relative;
            height: 32px;
            min-width: 96px;
            border-radius: 999px;
            background: 
                radial-gradient(135% 100% at 28% 12%, rgba(255, 69, 58, 0.28) 0%, rgba(255, 159, 10, 0.08) 70%),
                rgba(38, 24, 28, 0.78);
            border: 1px solid rgba(255, 95, 85, 0.32);
            box-shadow: 0 6px 16px rgba(255, 69, 58, 0.18), inset 0 1px 10px rgba(255, 255, 255, 0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: width 0.42s var(--spring-gooey), height 0.42s var(--spring-gooey), border-radius 0.38s var(--spring), background 0.25s, border-color 0.25s, transform 0.28s var(--spring-gooey);
            will-change: transform;
        }
        .asthma-morph-pill:not(.expanded):active {
            transform: scale3d(0.88, 0.88, 1);
        }
        .asthma-morph-pill.logged {
            background: 
                radial-gradient(135% 100% at 28% 12%, rgba(255, 69, 58, 0.44) 0%, rgba(255, 69, 58, 0.14) 70%),
                rgba(52, 22, 26, 0.88);
            border-color: rgba(255, 105, 97, 0.55);
            box-shadow: 0 6px 20px rgba(255, 69, 58, 0.34), inset 0 1px 10px rgba(255, 255, 255, 0.22);
        }
        .asthma-morph-pill.normal-state {
            background: 
                radial-gradient(135% 100% at 28% 12%, rgba(48, 209, 88, 0.28) 0%, rgba(48, 209, 88, 0.08) 70%),
                rgba(22, 38, 28, 0.82);
            border-color: rgba(48, 209, 88, 0.42);
            box-shadow: 0 6px 16px rgba(48, 209, 88, 0.18), inset 0 1px 10px rgba(255, 255, 255, 0.18);
        }
        .asthma-morph-pill.expanded {
            height: 36px;
            border-radius: 18px;
            background: 
                radial-gradient(135% 100% at 28% 12%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 69, 58, 0.1) 70%),
                rgba(26, 28, 36, 0.94);
            border-color: rgba(255, 255, 255, 0.22);
            cursor: default;
        }
        .asthma-pill-label {
            display: inline-flex;
            align-items: center;
            padding: 0 13px;
            font-size: 12px;
            font-weight: 600;
            color: #FF6961;
            white-space: nowrap;
            transition: opacity 0.16s ease, transform 0.3s var(--spring);
        }
        .asthma-morph-pill.logged .asthma-pill-label {
            color: #ffffff;
        }
        .asthma-morph-pill.normal-state .asthma-pill-label {
            color: var(--green);
        }
        .asthma-morph-pill.expanded .asthma-pill-label {
            opacity: 0;
            transform: scale3d(0.75, 0.75, 1);
            pointer-events: none;
            position: absolute;
        }
        .asthma-options {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 3px;
            opacity: 0;
            transform: scale3d(0.86, 0.86, 1);
            transition: opacity 0.18s ease, transform 0.32s var(--spring-gooey);
        }
        .asthma-morph-pill.expanded .asthma-options {
            display: inline-flex;
            opacity: 1;
            transform: scale3d(1, 1, 1);
        }
        .asthma-opt-btn {
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 9px;
            border-radius: 13px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: inset 0 1px 6px rgba(255,255,255,0.1);
            transition: background 0.15s, transform 0.25s var(--spring-gooey);
        }
        .asthma-opt-btn:active {
            transform: scale3d(0.88, 0.88, 1);
        }
        .asthma-opt-btn.danger {
            background: rgba(255, 69, 58, 0.26);
            color: #FF8A80;
        }
        .asthma-opt-btn.normal {
            background: rgba(48, 209, 88, 0.22);
            color: #6EE787;
        }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
        }
        .stat-box {
            border-radius: 22px;
            padding: 14px;
        }
        .stat-num {
            font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .glass-segmented {
            position: relative;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 3px;
            margin-bottom: 12px;
        }
        .seg-pill {
            position: absolute;
            top: 3px; bottom: 3px; left: 3px;
            width: calc((100% - 6px) / 3);
            background: radial-gradient(125% 95% at 30% 10%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.08) 100%);
            border-radius: 11px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.32), inset 0 1px 10px rgba(255,255,255,0.18);
            transition: transform 0.38s var(--spring-gooey);
            will-change: transform;
            pointer-events: none;
        }
        .glass-segmented button {
            position: relative; z-index: 1;
            flex: 1; border: none; background: transparent; color: var(--text-secondary);
            font-size: 12px; font-weight: 600; padding: 6px 0; border-radius: 11px;
            cursor: pointer; transition: color 0.2s ease, transform 0.2s var(--spring-gooey);
        }
        .glass-segmented button:active { transform: scale3d(0.88, 0.88, 1); }
        .glass-segmented button.active { color: var(--text); }

        .chart-wrap-day {
            height: 150px; position: relative;
        }

        .section-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-secondary); margin: 4px 4px 8px;
        }

        .day-list {
            display: flex; flex-direction: column; gap: 8px;
        }

        .measurement-item { 
            position: relative;

            contain-intrinsic-size: 54px;

                radial-gradient(135% 90% at 25% 0%, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 62%, transparent 100%),
                rgba(20, 23, 32, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.12);

            flex-shrink: 0; box-shadow: 0 6px 16px rgba(0,0,0,0.26), inset 0 1px 14px rgba(255,255,255,0.08);

        }
        .measurement-item:active {
            transform: scale3d(0.96, 0.96, 1);
        }
        .measurement-item.open {
            content-visibility: visible;
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(100, 185, 255, 0.24) 0%, rgba(10, 132, 255, 0.06) 65%, transparent 100%),
                rgba(24, 29, 40, 0.88);

        }

        .m-top-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            pointer-events: none;
        }
        .m-left-wrap {
            display: flex; align-items: center; gap: 7px; flex-wrap: wrap;

        .m-state-tag {

        .m-state-tag.dyspnea {

        .measurement-item.open .m-chevron {
            transform: rotate(180deg);

        .m-expand-body {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-top: 0;
            transform: scale3d(0.95, 0.95, 1);
            transform-origin: top center;
            transition: max-height 0.38s var(--spring), opacity 0.22s ease, margin-top 0.28s var(--spring), transform 0.36s var(--spring);
            pointer-events: none;
        }
        .measurement-item.open .m-expand-body {
            max-height: 185px;
            opacity: 1;
            margin-top: 12px;
            transform: scale3d(1, 1, 1);
        }
        .m-chart-box {
            height: 130px;
            width: 100%;
            background: rgba(0, 0, 0, 0.28);
            border-radius: 16px;
            padding: 8px 10px 4px;
            box-sizing: border-box;
            position: relative;
        }
        .m-chart-caption {
            display: flex; justify-content: space-between;
            font-size: 11px; color: var(--text-secondary);
            margin-top: 6px; padding: 0 2px;
        }

        .m-time { color: var(--text-secondary); font-size: 15px; font-weight: 500; }
        .m-value { font-size: 17px; font-weight: 600; }

        #fabContainer {
            position: fixed; bottom: 30px; left: 20px;
            width: 56px; height: 56px;
            transform-origin: bottom left;
            background: 
                radial-gradient(135% 100% at 28% 12%, rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0.04) 68%),
                rgba(28, 32, 44, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 16px 36px rgba(0,0,0,0.54), inset 0 2px 16px rgba(255,255,255,0.24);
            border-radius: 28px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: width 0.44s var(--spring-gooey), height 0.44s var(--spring-gooey), border-radius 0.4s var(--spring), background 0.22s, transform 0.26s var(--spring-gooey);
            z-index: 500; overflow: hidden; cursor: pointer;
            will-change: width, height, transform;
        }
        
        #fabContainer:not(.expanded):active { transform: scale3d(0.84, 0.84, 1); }

        #fabContainer.expanded {
            width: 160px; height: 170px; border-radius: 30px;
            background: 
                radial-gradient(135% 100% at 28% 12%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.03) 68%),
                rgba(22, 25, 34, 0.94);
            box-shadow: 0 26px 54px rgba(0,0,0,0.74), inset 0 2px 18px rgba(255,255,255,0.2);
            cursor: default;
        }

        .fab-plus { 
            position: absolute; font-size: 32px; font-weight: 300; color: white; 
            transition: opacity 0.16s, transform 0.36s var(--spring-gooey); 
        }
        #fabContainer.expanded .fab-plus { opacity: 0; transform: rotate(135deg) scale3d(0.2, 0.2, 1); pointer-events: none; }

        .fab-menu-content {
            display: flex; flex-direction: column; gap: 7px; width: 100%; padding: 12px; box-sizing: border-box;
            opacity: 0; pointer-events: none;
            transition: opacity 0.18s ease;
        }
        
        #fabContainer.expanded .fab-menu-content { 
            opacity: 1; pointer-events: auto; 
            transition-delay: 0.04s; 
        }

        .fab-action-btn {
            background: rgba(255,255,255,0.08); border: none; padding: 10px 14px; border-radius: 16px; color: white;
            display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 500;
            box-shadow: inset 0 1px 10px rgba(255,255,255,0.1);
            cursor: pointer; 
            opacity: 0; transform: scale3d(0.86, 0.86, 1);
            transition: background 0.14s, transform 0.3s var(--spring-gooey), opacity 0.18s; 
            width: 100%;
        }
        #fabContainer.expanded .fab-action-btn { opacity: 1; transform: scale3d(1, 1, 1); }
        #fabContainer.expanded .fab-action-btn:nth-child(1) { transition-delay: 0.03s; }
        #fabContainer.expanded .fab-action-btn:nth-child(2) { transition-delay: 0.06s; }
        #fabContainer.expanded .fab-action-btn:nth-child(3) { transition-delay: 0.09s; }

        .fab-action-btn:active { background: rgba(255,255,255,0.24); transform: scale3d(0.9, 0.9, 1) !important; }

        .chart-container { 
            position: relative;
            flex: 1; width: 100%; height: 100%; 
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 60%, transparent 100%),
                rgba(20, 23, 32, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 26px; padding: 15px; 
            box-sizing: border-box;
            box-shadow: inset 0 2px 18px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div id="hzAnchor"></div>
    <div class="ambient-canvas">
        <div class="liquid-blob blob-1"></div>
        <div class="liquid-blob blob-2"></div>
        <div class="liquid-blob blob-3"></div>
    </div>

    <!-- КАЛЕНДАРЬ -->
    <div id="calendarView" class="view active">
        <div class="header">
            <button id="prevBtn">&#8249;</button>
            <span id="monthTitle"></span>
            <button id="nextBtn">&#8250;</button>
        </div>
        <div class="weekdays">
            <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div class="weekends">СБ</div><div class="weekends">ВС</div>
        </div>
        <div class="calendar" id="calendarGrid"></div>
    </div>

    <!-- МЕСЯЧНЫЙ ГРАФИК -->
    <div id="graphView" class="view">
        <div class="header">
            <button id="prevMonthGraph">&#8249;</button>
            <span id="monthTitleGraph"></span>
            <button id="nextMonthGraph">&#8250;</button>
        </div>
        <div class="chart-container">
            <canvas id="monthlyChart"></canvas>
        </div>
    </div>

    <!-- ДЕНЬ (LIQUID GLASS) -->
    <div id="dayView" class="view">
        <div class="header">
            <span>День</span>
            <button id="refreshDayBtn" class="refresh-glass-btn" onclick="loadData(true)"><span class="refresh-icon">↻</span> Обновить</button>
        </div>

        <div id="heroCard" class="glass-card hero-card anim-stagger-1">
            <div class="card-header">
                <span class="card-title">Последний выдох</span>
                <span id="zoneBadge" class="glass-badge zone-green">Норма</span>
            </div>
            <div class="hero-row">
                <span id="lastFlow" class="hero-value">—</span>
                <span class="hero-unit">л/мин</span>
            </div>
            <div class="hero-footer-row">
                <div id="lastTime" class="hero-meta">Загрузка точек с ESP32...</div>
                <div id="asthmaMorphPill" class="asthma-morph-pill" onclick="toggleAsthmaPill(event)">
                    <span id="asthmaPillLabel" class="asthma-pill-label">Отдышка</span>
                    <div class="asthma-options">
                        <button type="button" class="asthma-opt-btn danger" onclick="logAsthmaEvent('Отдышка', event)">Отдышка</button>
                        <button type="button" class="asthma-opt-btn normal" onclick="logAsthmaEvent('Нормальное состояние', event)">Нормальное состояние</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-grid anim-stagger-2">
            <div class="stat-box">
                <div class="card-title">Лучший (норма)</div>
                <div class="stat-num"><span id="bestFlowNum">400</span> <span style="font-size:13px;font-weight:500;color:var(--text-secondary)">л/м</span></div>
            </div>
            <div class="stat-box">
                <div class="card-title">Средний пик</div>
                <div class="stat-num"><span id="avgFlowNum">—</span> <span style="font-size:13px;font-weight:500;color:var(--text-secondary)">л/м</span></div>
            </div>
        </div>

        <div class="glass-card anim-stagger-3">
            <div class="card-header">
                <span class="card-title">Интенсивность выдоха</span>
                <span id="intensityMeta" class="card-sub-hint">Последний замер</span>
            </div>
            <div class="chart-wrap-day" style="height:140px">
                <canvas id="intensityMainChart"></canvas>
            </div>
        </div>

        <div class="glass-card anim-stagger-4">
            <div class="card-header">
                <span class="card-title">Динамика ПСВ</span>
            </div>
            <div class="glass-segmented">
                <div id="segPill" class="seg-pill"></div>
                <button class="active" onclick="setDayRange(7, 0, this)">7 замеров</button>
                <button onclick="setDayRange(20, 1, this)">20 замеров</button>
                <button onclick="setDayRange(100, 2, this)">Все</button>
            </div>
            <div class="chart-wrap-day">
                <canvas id="dayChart"></canvas>
            </div>
        </div>

        <div class="section-label anim-stagger-5">
            <span>Все замеры</span>
            <span id="totalRecordsCount" style="color:#64D2FF"></span>
        </div>
        <div id="dayHistoryList" class="day-list anim-stagger-5"></div>
    </div>

    <!-- FAB МЕНЮ -->
    <div id="fabContainer" onclick="toggleFab(event)">
        <div class="fab-plus">+</div>
        <div class="fab-menu-content">
            <button class="fab-action-btn" onclick="switchToView('day', event)">📊 День</button>
            <button class="fab-action-btn" onclick="switchToView('graph', event)">📈 График</button>
            <button class="fab-action-btn" onclick="switchToView('calendar', event)">📅 Календарь</button>
        </div>
    </div>

    <div id="modalBackdrop" onclick="closeExpandedCell()"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        (function lock144Hz() {
            const anchor = document.getElementById('hzAnchor');
            if (!anchor) return;
            let toggle = false;
            function tick() {
                toggle = !toggle;
                anchor.style.transform = toggle ? 'translate3d(0.01px,0,0)' : 'translate3d(0,0,0)';
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        })();

        if (window.Chart) {
            Chart.defaults.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            Chart.defaults.elements.point.hitRadius = 10;
        }

        const scriptUrl = "https://script.google.com/macros/s/AKfycbxh0Poo3SwCP1-2wyQtV5BfGbxvOTKG012sbCPbNlRe-ay82MaTmHbT1ComA1CXT3Wv_Q/exec";
        const PERSONAL_BEST = 400;
        const MONTH_NAMES = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const MONTH_NAMES_GEN = ["Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"];

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let allData = {};
        let flatRecords = [];
        let monthlyChartInstance = null;
        let dayChartInstance = null;
        let intensityMainChartInstance = null;
        const inlineCharts = new Map();
        const labelsCache = new Map();
        let dayRangeLimit = 7;
        let currentView = 'calendar';

        let activeCell = null;
        let activePlaceholder = null;
        let activeCellFlipTransform = '';
        let restoreTimer = null;

        function haptic(type = 'light') {
            if (!tg?.HapticFeedback) return;
            if (type === 'selection') tg.HapticFeedback.selectionChanged();
            else tg.HapticFeedback.impactOccurred(type);
        }

        function getSavedStatesMap() {
            try {
                return JSON.parse(localStorage.getItem('exhaleStates') || '{}');
            } catch (err) {
                return {};
            }
        }

        function saveStateLocally(ts, symptom, time) {
            try {
                const map = getSavedStatesMap();
                map[String(ts)] = { symptom, time };
                localStorage.setItem('exhaleStates', JSON.stringify(map));
            } catch (err) {}
        }

        function toggleAsthmaPill(e) {
            e.stopPropagation();
            const pill = document.getElementById('asthmaMorphPill');
            if (!pill.classList.contains('expanded')) {
                haptic('light');
                pill.classList.add('expanded');
            }
        }

        function applyAsthmaStateVisual(symptom, exhaleTime) {
            const pill = document.getElementById('asthmaMorphPill');
            const label = document.getElementById('asthmaPillLabel');
            const card = document.getElementById('heroCard');
            if (!pill || !label || !card) return;

            pill.classList.remove('expanded', 'logged', 'normal-state');
            card.classList.remove('state-dyspnea', 'state-normal');

            if (!symptom) {
                label.innerText = 'Отдышка';
                return;
            }

            const suffix = exhaleTime ? ` • ${exhaleTime}` : '';
            if (symptom === 'Нормальное состояние') {
                pill.classList.add('normal-state');
                card.classList.add('state-normal');
                label.innerText = `Нормальное состояние${suffix}`;
            } else {
                pill.classList.add('logged');
                card.classList.add('state-dyspnea');
                label.innerText = `Отдышка${suffix}`;
            }
        }

        function logAsthmaEvent(symptom, e) {
            if (e) e.stopPropagation();
            haptic('medium');
            const latest = flatRecords.length ? flatRecords[0] : null;
            const exhaleTime = latest ? latest.shortTime : '';
            const currentPeak = latest ? Math.round(latest.flow) : 0;
            const recordKey = latest ? String(latest.ts) : 'latest';

            if (latest) {
                latest.symptom = symptom;
            }

            applyAsthmaStateVisual(symptom, exhaleTime);
            saveStateLocally(recordKey, symptom, exhaleTime);

            // Обновляем отображение везде (список замеров, календарь, месячный график)
            renderCalendar();
            if (currentView === 'graph') renderMonthlyGraph();
            renderDayHistoryListOnly();

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'asthma',
                    symptom: symptom,
                    flow: currentPeak,
                    time: exhaleTime
                })
            }).catch(() => {});
        }

        function syncHeroAsthmaState(rec) {
            if (!rec) {
                applyAsthmaStateVisual(null, '');
                return;
            }
            if (rec.symptom) {
                applyAsthmaStateVisual(rec.symptom, rec.shortTime);
                return;
            }
            const map = getSavedStatesMap();
            const saved = map[String(rec.ts)];
            if (saved && saved.symptom) {
                rec.symptom = saved.symptom;
                applyAsthmaStateVisual(saved.symptom, rec.shortTime);
            } else {
                applyAsthmaStateVisual(null, '');
            }
        }

        function animateValue(el, target, duration = 420) {
            const start = Number(el.innerText) || 0;
            if (start === target) { el.innerText = target; return; }
            const startTime = performance.now();
            function step(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 4);
                el.innerText = Math.round(start + (target - start) * ease);
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function parseAnyDate(raw) {
            if (!raw) return null;
            if (raw instanceof Date && !isNaN(raw.getTime())) return raw;

            const str = String(raw).trim();
            const m = str.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:[,\sT]+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
            if (m) {
                return new Date(
                    Number(m[3]),
                    Number(m[2]) - 1,
                    Number(m[1]),
                    Number(m[4] || 0),
                    Number(m[5] || 0),
                    Number(m[6] || 0)
                );
            }

            const d = new Date(str);
            return isNaN(d.getTime()) ? null : d;
        }

        function parsePoints(rawPoints, peakFlow) {
            if (Array.isArray(rawPoints) && rawPoints.length >= 2) {
                return rawPoints.map(Number).filter(n => !isNaN(n));
            }
            if (typeof rawPoints === 'string') {
                const trimmed = rawPoints.trim();
                if (trimmed.startsWith('[')) {
                    try {
                        const arr = JSON.parse(trimmed);
                        if (Array.isArray(arr) && arr.length >= 2) {
                            return arr.map(Number).filter(n => !isNaN(n));
                        }
                    } catch (e) {}
                }
            }
            const p = Number(peakFlow) || 0;
            return [0, p * 0.45, p * 0.86, p, p * 0.82, p * 0.58, p * 0.34, p * 0.14, 0];
        }

        function getSampleStepSec(pointsLength) {
            return pointsLength > 80 ? 0.01 : 0.05;
        }

        function buildIntensityLabels(count) {
            const dt = getSampleStepSec(count);
            const key = `${count}_${dt}`;
            if (labelsCache.has(key)) return labelsCache.get(key);
            const labels = new Array(count);
            for (let i = 0; i < count; i++) labels[i] = (i * dt).toFixed(2) + 'с';
            labelsCache.set(key, labels);
            return labels;
        }

        function drawIntensityChart(canvasEl, points, color, existingChart = null) {
            if (!canvasEl) return null;
            let end = points.length;
            while (end > 8 && points[end - 1] === 0 && points[end - 2] === 0 && points[end - 3] === 0) {
                end--;
            }
            const trimmed = end === points.length ? points : points.slice(0, end);
            const labels = buildIntensityLabels(trimmed.length);
            const showDots = trimmed.length <= 70 ? 2 : 0;

            if (existingChart) {
                existingChart.data.labels = labels;
                existingChart.data.datasets[0].data = trimmed;
                existingChart.data.datasets[0].borderColor = color;
                existingChart.data.datasets[0].backgroundColor = color + '32';
                existingChart.data.datasets[0].pointRadius = showDots;
                existingChart.data.datasets[0].pointBackgroundColor = color;
                existingChart.update('none');
                return existingChart;
            }

            const ctx = canvasEl.getContext('2d', { desynchronized: true });
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: trimmed,
                        borderColor: color,
                        backgroundColor: color + '32',
                        borderWidth: 2.5,
                        pointRadius: showDots,
                        pointHoverRadius: 5,
                        pointBackgroundColor: color,
                        pointBorderWidth: 0,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 260, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            ticks: { color: 'rgba(235,235,245,0.58)', font: { size: 9 }, maxTicksLimit: 6 },
                            grid: { display: false }
                        },
                        y: {
                            min: 0,
                            ticks: { color: 'rgba(235,235,245,0.58)', font: { size: 10 }, maxTicksLimit: 4 },
                            grid: { color: 'rgba(255,255,255,0.07)' }
                        }
                    }
                }
            });
        }

        function cleanupInlineCharts(prefix) {
            for (const [key, chart] of inlineCharts.entries()) {
                if (key.startsWith(prefix)) {
                    chart.destroy();
                    inlineCharts.delete(key);
                }
            }
        }

        function toggleFab(e) {
            if (e.target.id === 'fabContainer' || e.target.classList.contains('fab-plus')) {
                haptic('light');
                document.getElementById('fabContainer').classList.toggle('expanded');
            }
        }

        document.addEventListener('pointerdown', function(event) {
            const fab = document.getElementById('fabContainer');
            if (fab.classList.contains('expanded') && !fab.contains(event.target)) {
                fab.classList.remove('expanded');
            }
            const pill = document.getElementById('asthmaMorphPill');
            if (pill && pill.classList.contains('expanded') && !pill.contains(event.target)) {
                pill.classList.remove('expanded');
            }
        }, { passive: true });

        function switchToView(target, e) {
            if (e) e.stopPropagation(); 
            document.getElementById('fabContainer').classList.remove('expanded');
            if (activeCell) closeExpandedCell(true);
            if (currentView === target) return;
            haptic('selection');

            const views = [
                document.getElementById('calendarView'),
                document.getElementById('graphView'),
                document.getElementById('dayView')
            ];
            for (let i = 0; i < views.length; i++) {
                views[i].classList.add('animating');
                views[i].classList.remove('active');
            }

            let targetEl;
            if (target === 'graph') {
                targetEl = document.getElementById('graphView');
                targetEl.classList.add('active');
                currentView = 'graph';
                renderMonthlyGraph();
            } else if (target === 'day') {
                targetEl = document.getElementById('dayView');
                targetEl.classList.add('active');
                currentView = 'day';
                renderDayView(true);
            } else {
                targetEl = document.getElementById('calendarView');
                targetEl.classList.add('active');
                currentView = 'calendar';
                renderCalendar();
            }

            setTimeout(() => {
                for (let i = 0; i < views.length; i++) views[i].classList.remove('animating');
            }, 460);
        }

        async function loadData(withHaptic = false) {
            const btn = document.getElementById('refreshDayBtn');
            if (withHaptic) {
                haptic('medium');
                if (btn) {
                    btn.classList.remove('spinning');
                    void btn.offsetWidth;
                    btn.classList.add('spinning');
                }
            }
            document.getElementById('lastTime').innerText = 'Загрузка точек с ESP32...';
            try {
                const response = await fetch(scriptUrl + "?action=getData");
                const data = await response.json();
                const localMap = getSavedStatesMap();
                allData = {};
                flatRecords = [];

                for (let i = 0; i < data.length; i++) {
                    const dateObj = parseAnyDate(data[i][0]); 
                    const flow = parseFloat(String(data[i][1]).replace(',', '.')); 
                    if (!dateObj || isNaN(flow) || flow <= 0) continue; 
                    
                    const points = parsePoints(data[i][2], flow);
                    const y = dateObj.getFullYear();
                    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const d = String(dateObj.getDate()).padStart(2, '0');
                    const hh = String(dateObj.getHours()).padStart(2, '0');
                    const mm = String(dateObj.getMinutes()).padStart(2, '0');
                    const ss = String(dateObj.getSeconds()).padStart(2, '0');

                    const ts = dateObj.getTime();
                    const dateKey = `${y}-${m}-${d}`;
                    const timeStr = `${hh}:${mm}:${ss}`;
                    const shortTime = `${hh}:${mm}`;
                    const fullDate = `${d}.${m} • ${shortTime}`;

                    // Берём состояние из 4-го столбца Google Таблицы или из локального кэша
                    const sheetState = data[i][3] ? String(data[i][3]).trim() : '';
                    const localState = localMap[String(ts)]?.symptom || '';
                    const symptom = sheetState || localState || '';
                    if (symptom && !localState) {
                        saveStateLocally(ts, symptom, shortTime);
                    }
                    
                    const rec = { ts, time: timeStr, fullDate, shortTime, flow, hour: dateObj.getHours(), points, symptom };
                    if (!allData[dateKey]) allData[dateKey] = [];
                    allData[dateKey].push(rec);
                    flatRecords.push(rec);
                }

                flatRecords.sort((a, b) => b.ts - a.ts);
                renderCalendar();
                if (currentView === 'graph') renderMonthlyGraph();
                renderDayView(true);
            } catch (error) {
                console.error("Ошибка загрузки", error);
                document.getElementById('lastTime').innerText = 'Ошибка загрузки';
                renderCalendar();
            }
        }

        document.getElementById('calendarGrid').addEventListener('click', function(e) {
            const cell = e.target.closest('.day-cell');
            if (!cell || cell.classList.contains('empty-cell') || cell.classList.contains('morphing-cell')) return;
            const day = Number(cell.dataset.day);
            const dateKey = cell.dataset.key;
            if (!day || !dateKey) return;
            openCellMorph(cell, day, allData[dateKey] || []);
        });

        function renderCalendar() {
            if (activeCell) closeExpandedCell(true);
            const title = `${MONTH_NAMES[currentMonth]} ${currentYear}`;
            document.getElementById('monthTitle').innerText = title;
            document.getElementById('monthTitleGraph').innerText = title;
            
            const grid = document.getElementById('calendarGrid');
            const frag = document.createDocumentFragment();
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const startDay = firstDay === 0 ? 7 : firstDay; 
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-`;
            
            for (let i = 1; i < startDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day-cell empty-cell';
                frag.appendChild(emptyDiv);
            }
            
            const today = new Date();
            const isCurrentMonthYear = currentMonth === today.getMonth() && currentYear === today.getFullYear();
            const todayDate = today.getDate();

            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.style.animationDelay = `${Math.min(day * 0.008, 0.24)}s`;
                if (isCurrentMonthYear && day === todayDate) cell.classList.add('today');
                
                const dateKey = monthPrefix + String(day).padStart(2, '0');
                cell.dataset.day = day;
                cell.dataset.key = dateKey;

                const measurements = allData[dateKey];
                if (measurements && measurements.length > 0) {
                    cell.classList.add('has-data');
                    let maxFlow = 0;
                    let hasDyspnea = false;
                    for (let j = 0; j < measurements.length; j++) {
                        if (measurements[j].flow > maxFlow) maxFlow = measurements[j].flow;
                        if (measurements[j].symptom === 'Отдышка') hasDyspnea = true;
                    }
                    if (hasDyspnea) cell.classList.add('has-dyspnea');
                    const colorClass = maxFlow >= 320 ? 'val-green' : 'val-blue';
                    const dotHtml = hasDyspnea ? '<span class="day-dyspnea-dot"></span>' : '';
                    cell.innerHTML = `${dotHtml}<span class="day-num">${day}</span><span class="day-val ${colorClass}">${Math.round(maxFlow)}</span>`;
                } else {
                    cell.innerHTML = `<span class="day-num">${day}</span>`;
                }
                frag.appendChild(cell);
            }
            grid.innerHTML = '';
            grid.appendChild(frag);
        }

        function renderMonthlyGraph() {
            const ctx = document.getElementById('monthlyChart').getContext('2d', { desynchronized: true });
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-`;
            const labels = new Array(daysInMonth);
            const morningData = new Array(daysInMonth);
            const eveningData = new Array(daysInMonth);
            const morningPointColors = new Array(daysInMonth);
            const eveningPointColors = new Array(daysInMonth);

            for (let day = 1; day <= daysInMonth; day++) {
                labels[day - 1] = day;
                const measurements = allData[monthPrefix + String(day).padStart(2, '0')];
                
                if (measurements && measurements.length > 0) {
                    let maxM = -1, maxE = -1;
                    let dispM = false, dispE = false;
                    for (let j = 0; j < measurements.length; j++) {
                        const m = measurements[j];
                        if (m.hour < 12) {
                            if (m.flow > maxM) maxM = m.flow;
                            if (m.symptom === 'Отдышка') dispM = true;
                        } else {
                            if (m.flow > maxE) maxE = m.flow;
                            if (m.symptom === 'Отдышка') dispE = true;
                        }
                    }
                    morningData[day - 1] = maxM >= 0 ? Math.min(maxM, 400) : null;
                    eveningData[day - 1] = maxE >= 0 ? Math.min(maxE, 400) : null;
                    morningPointColors[day - 1] = dispM ? '#FF453A' : '#30D158';
                    eveningPointColors[day - 1] = dispE ? '#FF453A' : '#0A84FF';
                } else {
                    morningData[day - 1] = null;
                    eveningData[day - 1] = null;
                    morningPointColors[day - 1] = '#30D158';
                    eveningPointColors[day - 1] = '#0A84FF';
                }
            }

            if (monthlyChartInstance) monthlyChartInstance.destroy();

            monthlyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Утро',
                            data: morningData,
                            borderColor: '#30D158',
                            backgroundColor: 'rgba(48, 209, 88, 0.16)',
                            borderWidth: 3,
                            pointRadius: 5.5,
                            pointHoverRadius: 7.5,
                            pointBorderWidth: 2.5,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: morningPointColors,
                            tension: 0.4,
                            spanGaps: true,
                            fill: false
                        },
                        {
                            label: 'День/Вечер',
                            data: eveningData,
                            borderColor: '#0A84FF',
                            backgroundColor: 'rgba(10, 132, 255, 0.16)',
                            borderWidth: 3,
                            pointRadius: 5.5,
                            pointHoverRadius: 7.5,
                            pointBorderWidth: 2.5,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: eveningPointColors,
                            tension: 0.4,
                            spanGaps: true,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 320, easing: 'easeOutQuart' },
                    plugins: { legend: { display: true, labels: { color: 'rgba(235,235,245,0.85)' } } },
                    scales: {
                        x: { ticks: { color: 'rgba(235,235,245,0.62)', stepSize: 1, autoSkip: false, maxRotation: 90, minRotation: 90 }, grid: { display: false } },
                        y: {
                            min: 0,
                            max: 420,
                            ticks: {
                                color: 'rgba(235,235,245,0.62)',
                                stepSize: 50,
                                callback: (v) => (v <= 400 ? v : '')
                            },
                            grid: { color: 'rgba(255,255,255,0.08)' }
                        }
                    }
                }
            });
        }

        function getZone(flow) {
            const pct = (flow / PERSONAL_BEST) * 100;
            if (pct >= 80) return { label: 'Зелёная зона', cls: 'zone-green', color: '#30D158' };
            if (pct >= 50) return { label: 'Жёлтая зона', cls: 'zone-orange', color: '#FF9F0A' };
            return { label: 'Красная зона', cls: 'zone-red', color: '#FF453A' };
        }

        function createExpandableMeasurementCard(m, labelText, uid) {
            const z = getZone(m.flow);
            const item = document.createElement('div');
            item.className = 'measurement-item';
            item.dataset.uid = uid;
            item._record = m;

            let activePointsCount = 0;
            for (let i = 0; i < m.points.length; i++) if (m.points[i] > 0) activePointsCount++;
            const durationSec = (activePointsCount * getSampleStepSec(m.points.length)).toFixed(2);

            let stateTagHtml = '';
            if (m.symptom === 'Отдышка') {
                stateTagHtml = `<span class="m-state-tag dyspnea">Отдышка</span>`;
            } else if (m.symptom === 'Нормальное состояние') {
                stateTagHtml = `<span class="m-state-tag normal">Нормальное состояние</span>`;
            }

            item.innerHTML = `
                <div class="m-top-row">
                    <div class="m-left-wrap">
                        <span class="m-time">🕒 ${labelText}</span>
                        ${stateTagHtml}
                    </div>
                    <div class="m-right-wrap">
                        <span class="m-value" style="color:${z.color}">${Math.round(m.flow)} л/м</span>
                        <span class="m-chevron">▾</span>
                    </div>
                </div>
                <div class="m-expand-body">
                    <div class="m-chart-box">
                        <canvas id="canvas_${uid}"></canvas>
                    </div>
                    <div class="m-chart-caption">
                        <span>Точек выдоха: ${activePointsCount}</span>
                        <span>Время выдоха: ${durationSec} с</span>
                    </div>
                </div>
            `;
            return item;
        }

        function handleMeasurementListClick(container, e, onSelectCallback = null) {
            const item = e.target.closest('.measurement-item');
            if (!item) return;
            e.stopPropagation();
            haptic('selection');

            const wasOpen = item.classList.contains('open');
            const prevOpen = container.querySelector('.measurement-item.open');
            if (prevOpen) prevOpen.classList.remove('open');

            const m = item._record;
            const uid = item.dataset.uid;
            if (!wasOpen && m) {
                item.classList.add('open');
                const z = getZone(m.flow);
                requestAnimationFrame(() => {
                    const canvas = item.querySelector(`#canvas_${uid}`);
                    if (inlineCharts.has(uid)) {
                        inlineCharts.get(uid).destroy();
                    }
                    inlineCharts.set(uid, drawIntensityChart(canvas, m.points, z.color));
                });
            }

            if (onSelectCallback && m) {
                onSelectCallback(m);
            }
        }

        document.getElementById('dayHistoryList').addEventListener('click', function(e) {
            handleMeasurementListClick(this, e, selectMainIntensityRecord);
        });

        function setDayRange(limit, index, btn) {
            if (dayRangeLimit === limit) return;
            haptic('selection');
            dayRangeLimit = limit;

            document.getElementById('segPill').style.transform = `translate3d(${index * 100}%, 0, 0)`;

            document.querySelectorAll('#dayView .glass-segmented button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDayChartOnly();
        }

        function updateDayChartOnly() {
            const slice = flatRecords.slice(0, dayRangeLimit).reverse();
            if (dayChartInstance) {
                dayChartInstance.data.labels = slice.map(r => r.shortTime);
                dayChartInstance.data.datasets[0].data = slice.map(r => r.flow);
                dayChartInstance.data.datasets[0].pointBackgroundColor = slice.map(r => r.symptom === 'Отдышка' ? '#FF453A' : getZone(r.flow).color);
                dayChartInstance.update('none');
            }
        }

        function selectMainIntensityRecord(rec) {
            const z = getZone(rec.flow);
            document.getElementById('intensityMeta').innerText = `${rec.fullDate} • пик ${Math.round(rec.flow)} л/м`;
            const canvas = document.getElementById('intensityMainChart');
            intensityMainChartInstance = drawIntensityChart(canvas, rec.points, z.color, intensityMainChartInstance);
        }

        function renderDayHistoryListOnly() {
            const listEl = document.getElementById('dayHistoryList');
            if (!listEl || !flatRecords.length) return;
            cleanupInlineCharts('day_');
            const frag = document.createDocumentFragment();
            for (let idx = 0; idx < flatRecords.length; idx++) {
                frag.appendChild(createExpandableMeasurementCard(flatRecords[idx], flatRecords[idx].fullDate, `day_${idx}`));
            }
            listEl.innerHTML = '';
            listEl.appendChild(frag);
            updateDayChartOnly();
        }

        function renderDayView(withCounter = true) {
            const listEl = document.getElementById('dayHistoryList');
            document.getElementById('totalRecordsCount').innerText = flatRecords.length ? `${flatRecords.length} шт.` : '';
            cleanupInlineCharts('day_');

            if (!flatRecords.length) {
                document.getElementById('lastFlow').innerText = '0';
                document.getElementById('lastTime').innerText = 'Замеров в таблице пока нет';
                document.getElementById('avgFlowNum').innerText = '0';
                syncHeroAsthmaState(null);
                listEl.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding:16px; font-size:14px;">Нет данных</div>`;
                return;
            }

            const latest = flatRecords[0];
            const zone = getZone(latest.flow);
            const heroEl = document.getElementById('lastFlow');
            const bestEl = document.getElementById('bestFlowNum');
            const avgEl = document.getElementById('avgFlowNum');

            let sum = 0;
            for (let i = 0; i < flatRecords.length; i++) sum += flatRecords[i].flow;
            const avgVal = Math.round(sum / flatRecords.length);

            if (withCounter) {
                animateValue(heroEl, Math.round(latest.flow), 420);
                animateValue(bestEl, PERSONAL_BEST, 420);
                animateValue(avgEl, avgVal, 420);
            } else {
                heroEl.innerText = Math.round(latest.flow);
                bestEl.innerText = PERSONAL_BEST;
                avgEl.innerText = avgVal;
            }

            document.getElementById('lastTime').innerText = latest.fullDate;
            syncHeroAsthmaState(latest);

            const badge = document.getElementById('zoneBadge');
            badge.innerText = zone.label;
            badge.className = 'glass-badge ' + zone.cls + ' pulse';
            setTimeout(() => badge.classList.remove('pulse'), 280);

            selectMainIntensityRecord(latest);

            const frag = document.createDocumentFragment();
            for (let idx = 0; idx < flatRecords.length; idx++) {
                frag.appendChild(createExpandableMeasurementCard(flatRecords[idx], flatRecords[idx].fullDate, `day_${idx}`));
            }
            listEl.innerHTML = '';
            listEl.appendChild(frag);

            const slice = flatRecords.slice(0, dayRangeLimit).reverse();
            const ctx = document.getElementById('dayChart').getContext('2d', { desynchronized: true });

            if (dayChartInstance) {
                updateDayChartOnly();
                return;
            }

            dayChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: slice.map(r => r.shortTime),
                    datasets: [{
                        data: slice.map(r => r.flow),
                        borderColor: '#0A84FF',
                        backgroundColor: 'rgba(10, 132, 255, 0.2)',
                        borderWidth: 3,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointBorderWidth: 2,
                        pointBackgroundColor: slice.map(r => r.symptom === 'Отдышка' ? '#FF453A' : getZone(r.flow).color),
                        pointBorderColor: '#fff',
                        fill: true,
                        tension: 0.42
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 320, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: 'rgba(235,235,245,0.58)', font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: 'rgba(235,235,245,0.58)', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.07)' } }
                    }
                }
            });
        }

        function openCellMorph(cellElement, day, measurements) {
            haptic('light');
            if (activeCell) closeExpandedCell(true);

            const rect = cellElement.getBoundingClientRect();
            activeCell = cellElement;

            const placeholder = document.createElement('div');
            placeholder.className = 'day-cell-placeholder';
            cellElement.parentNode.insertBefore(placeholder, cellElement);
            activePlaceholder = placeholder;

            document.body.appendChild(cellElement);

            const inner = document.createElement('div');
            inner.className = 'cell-modal-inner';
            inner.innerHTML = `
                <div class="expanded-header">
                    <div class="expanded-title">${day} ${MONTH_NAMES_GEN[currentMonth]}</div>
                    <button class="close-btn" type="button">×</button>
                </div>
                <div id="measurementList"></div>
            `;
            inner.querySelector('.close-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                closeExpandedCell(false);
            });

            const list = inner.querySelector('#measurementList');
            list.addEventListener('click', function(e) {
                handleMeasurementListClick(this, e, null);
            });

            if (measurements.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = "text-align:center; color:var(--text-secondary); margin-top:20px; font-size:15px;";
                empty.innerText = "Нет данных";
                list.appendChild(empty);
            } else {
                const sorted = [...measurements].sort((a, b) => a.time.localeCompare(b.time));
                const frag = document.createDocumentFragment();
                for (let idx = 0; idx < sorted.length; idx++) {
                    frag.appendChild(createExpandableMeasurementCard(sorted[idx], sorted[idx].time, `modal_${day}_${idx}`));
                }
                list.appendChild(frag);
            }
            cellElement.appendChild(inner);

            const targetTop = window.innerHeight * 0.08;
            const targetLeft = 18;
            const targetWidth = window.innerWidth - 36;
            const targetHeight = window.innerHeight * 0.84;

            const dx = rect.left - targetLeft;
            const dy = rect.top - targetTop;
            const sx = rect.width / targetWidth;
            const sy = rect.height / targetHeight;

            activeCellFlipTransform = `translate3d(${dx}px, ${dy}px, 0) scale3d(${sx}, ${sy}, 1)`;

            cellElement.style.transition = 'none';
            cellElement.classList.add('morphing-cell');
            cellElement.style.transform = activeCellFlipTransform;
            cellElement.offsetHeight;

            document.getElementById('modalBackdrop').classList.add('active');

            requestAnimationFrame(() => {
                cellElement.style.transition = 'transform 0.4s var(--spring)';
                cellElement.classList.add('is-open');
                cellElement.style.transform = 'translate3d(0, 0, 0) scale3d(1, 1, 1)';
            });
        }

        function closeExpandedCell(instant = false) {
            if (!activeCell) return;
            if (!instant) haptic('light');
            if (restoreTimer) {
                clearTimeout(restoreTimer);
                restoreTimer = null;
            }

            const cell = activeCell;
            const placeholder = activePlaceholder;

            document.getElementById('modalBackdrop').classList.remove('active');
            cell.classList.remove('is-open');
            cleanupInlineCharts('modal_');

            let finished = false;
            const finishRestore = () => {
                if (finished) return;
                finished = true;
                cell.removeEventListener('transitionend', onEnd);

                const inner = cell.querySelector('.cell-modal-inner');
                if (inner) inner.remove();

                cell.classList.remove('morphing-cell');
                cell.style.transition = 'none';
                cell.style.transform = '';

                if (placeholder && placeholder.parentNode) {
                    placeholder.parentNode.insertBefore(cell, placeholder);
                    placeholder.remove();
                }

                requestAnimationFrame(() => {
                    cell.style.transition = '';
                });

                activeCell = null;
                activePlaceholder = null;
                activeCellFlipTransform = '';
            };

            const onEnd = (e) => {
                if (e.target === cell && e.propertyName === 'transform') {
                    finishRestore();
                }
            };

            if (instant || !activeCellFlipTransform) {
                finishRestore();
                return;
            }

            cell.addEventListener('transitionend', onEnd);
            cell.style.transition = 'transform 0.34s var(--spring)';
            cell.style.transform = activeCellFlipTransform;

            restoreTimer = setTimeout(finishRestore, 360);
        }

        document.getElementById('prevBtn').addEventListener('click', () => { haptic('selection'); currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); });
        document.getElementById('nextBtn').addEventListener('click', () => { haptic('selection'); currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); });
        document.getElementById('prevMonthGraph').addEventListener('click', () => { haptic('selection'); currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); renderMonthlyGraph(); });
        document.getElementById('nextMonthGraph').addEventListener('click', () => { haptic('selection'); currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); renderMonthlyGraph(); });

        loadData();
    </script>
</body>
</html>
