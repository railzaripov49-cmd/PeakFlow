<!-- ================= НАЧАЛО КОДА (ВЕРСИЯ 14.9 - TRUE IN-PLACE CELL MORPH LIKE FAB) ================= -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <style>
        :root {
            --bg: #030408;
            --text: #ffffff;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --blue: #0A84FF;
            --green: #30D158;
            --orange: #FF9F0A;
            --red: #FF453A;
            --spring: cubic-bezier(0.22, 1, 0.36, 1);
            --spring-gooey: cubic-bezier(0.34, 1.42, 0.64, 1);
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px; overflow: hidden; height: 100vh; box-sizing: border-box;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; 
        }

        .ambient-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            contain: strict;
        }
        .liquid-blob {
            position: absolute; border-radius: 50%;
            will-change: transform;
        }
        .blob-1 {
            top: -4%; left: -10%; width: 460px; height: 460px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.42) 0%, rgba(56, 189, 248, 0.14) 42%, transparent 72%);
            animation: floatBlob1 10s ease-in-out infinite alternate;
        }
        .blob-2 {
            top: 32%; right: -14%; width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(48, 209, 88, 0.3) 0%, rgba(16, 185, 129, 0.08) 45%, transparent 72%);
            animation: floatBlob2 12s ease-in-out infinite alternate;
        }
        .blob-3 {
            bottom: -8%; left: 4%; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(94, 92, 230, 0.38) 0%, rgba(168, 85, 247, 0.1) 46%, transparent 72%);
            animation: floatBlob3 14s ease-in-out infinite alternate;
        }

        @keyframes floatBlob1 {
            0% { transform: translate3d(0, 0, 0) scale(0.92); }
            100% { transform: translate3d(22%, 18%, 0) scale(1.16); }
        }
        @keyframes floatBlob2 {
            0% { transform: translate3d(0, -14%, 0) scale(1.1); }
            100% { transform: translate3d(-22%, 15%, 0) scale(0.88); }
        }
        @keyframes floatBlob3 {
            0% { transform: translate3d(-14%, 8%, 0) scale(1); }
            100% { transform: translate3d(20%, -18%, 0) scale(1.15); }
        }

        .view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; pointer-events: none; 
            transform-origin: 48px calc(100% - 58px);
            transform: scale(0.18);
            border-radius: 80px;
            transition: opacity 0.3s var(--spring), transform 0.5s var(--spring), border-radius 0.48s var(--spring); 
            padding: 20px; box-sizing: border-box; z-index: 1;
            will-change: opacity, transform;
        }
        .view.active { 
            opacity: 1; pointer-events: auto; z-index: 10; 
            transform: scale(1);
            border-radius: 0px;
        }

        #dayView {
            overflow-y: auto;
            padding-bottom: 115px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            contain: content;
        }
        #dayView::-webkit-scrollbar { display: none; }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header button { 
            position: relative;
            background: 
                radial-gradient(130% 100% at 30% 15%, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.03) 68%),
                rgba(26, 28, 38, 0.65);
            border: none;
            box-shadow: 0 10px 22px rgba(0,0,0,0.38), inset 0 1px 12px rgba(255,255,255,0.16);
            color: var(--text); font-size: 18px; width: 42px; height: 42px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; 
            transition: background 0.2s, transform 0.4s var(--spring-gooey);
        }
        .header button:active { 
            background: rgba(255,255,255,0.26); 
            transform: scale(0.78); 
        }

        .header .refresh-glass-btn {
            width: auto; height: 36px; border-radius: 18px; padding: 0 14px;
            font-size: 14px; font-weight: 600; color: #64D2FF;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .refresh-icon {
            display: inline-block;
            transition: transform 0.6s var(--spring);
        }
        .refresh-glass-btn.spinning .refresh-icon {
            transform: rotate(360deg);
        }

        .weekdays { 
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; 
            font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); font-size: 12px; 
            flex-shrink: 0;
        }
        .weekends { color: var(--red); }
        
        .calendar { 
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; 
            align-content: start; 
        }

        @keyframes liquidDropIn {
            0% { opacity: 0; transform: scale(0.74); border-radius: 28px; }
            100% { opacity: 1; transform: scale(1); border-radius: 20px; }
        }

        /* =========================================
           ЯЧЕЙКА КАЛЕНДАРЯ (САМА РАЗДУВАЕТСЯ КАК КНОПКА +)
           ========================================= */
        .day-cell { 
            aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 20px; position: relative; cursor: pointer; overflow: hidden;
            
            background: 
                radial-gradient(140% 95% at 30% 10%, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.02) 58%, transparent 100%),
                radial-gradient(110% 80% at 75% 95%, rgba(100, 180, 255, 0.1) 0%, transparent 65%),
                rgba(22, 25, 34, 0.56);
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.34),
                inset 0 2px 14px rgba(255, 255, 255, 0.1);
            
            animation: liquidDropIn 0.44s var(--spring) backwards;
            transition: transform 0.34s var(--spring-gooey), border-radius 0.34s var(--spring), background 0.22s;
            will-change: transform;
        }
        .day-cell::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.04) 48%, rgba(255,255,255,0.18) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .day-cell:not(.morphing-cell):active { 
            transform: scale(0.86); 
            border-radius: 26px;
        }

        .day-cell.has-data {
            background: 
                radial-gradient(140% 95% at 30% 10%, rgba(255, 255, 255, 0.24) 0%, rgba(48, 209, 88, 0.12) 60%, transparent 100%),
                rgba(24, 30, 38, 0.68);
        }
        
        .day-cell.today { 
            background: 
                radial-gradient(140% 100% at 25% 10%, rgba(255, 255, 255, 0.34) 0%, rgba(10, 132, 255, 0.42) 55%, rgba(94, 92, 230, 0.32) 100%),
                rgba(16, 48, 98, 0.74);
            box-shadow: 0 12px 26px rgba(10, 132, 255, 0.4), inset 0 2px 16px rgba(255,255,255,0.26);
        }
        
        .day-num { 
            font-size: 17px; font-weight: 600; color: var(--text); pointer-events: none;
            transition: opacity 0.18s ease, transform 0.32s var(--spring);
        }
        .day-val { 
            font-size: 10px; font-weight: 700; position: absolute; bottom: 5px; pointer-events: none;
            transition: opacity 0.18s ease, transform 0.32s var(--spring);
        }
        
        .val-green { color: var(--green); }
        .val-blue { color: #64D2FF; }
        .day-cell.today .day-val { color: #ffffff; }

        .empty-cell { background: transparent; box-shadow: none; cursor: default; animation: none; }
        .empty-cell::before { display: none; }
        .empty-cell:active { transform: none; background: transparent; box-shadow: none; }

        /* Плейсхолдер, держащий дырку в сетке пока ячейка раздута */
        .day-cell-placeholder {
            aspect-ratio: 1 / 1;
            visibility: hidden;
            pointer-events: none;
        }

        /* Состояние самой ячейки, когда она раздувается в модальное окно */
        .day-cell.morphing-cell {
            position: fixed !important;
            aspect-ratio: auto !important;
            animation: none !important;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding: 20px;
            box-sizing: border-box;
            cursor: default;
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.03) 60%, transparent 100%),
                rgba(22, 25, 34, 0.88);
            backdrop-filter: blur(32px) saturate(200%) url(#liquidGlassFilter);
            -webkit-backdrop-filter: blur(32px) saturate(200%);
            box-shadow: 0 36px 72px rgba(0,0,0,0.74), inset 0 2px 20px rgba(255,255,255,0.18);
            will-change: top, left, width, height, border-radius;
        }
        .day-cell.morphing-cell.is-open .day-num,
        .day-cell.morphing-cell.is-open .day-val {
            opacity: 0;
            transform: scale(0.7);
        }

        /* Фон затемнения под раздутой ячейкой */
        #modalBackdrop {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(2, 4, 10, 0.56);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            opacity: 0; pointer-events: none;
            transition: opacity 0.34s var(--spring);
        }
        #modalBackdrop.active {
            opacity: 1; pointer-events: auto;
        }

        /* Внутренний контент внутри раздутой ячейки */
        .cell-modal-inner {
            display: flex; flex-direction: column; height: 100%; min-height: 0; width: 100%;
            opacity: 0;
            transform: scale(0.94);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.38s var(--spring);
        }
        .day-cell.morphing-cell.is-open .cell-modal-inner {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            transition-delay: 0.09s;
        }

        .expanded-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-shrink: 0; }
        .expanded-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); white-space: nowrap; }
        .close-btn { 
            background: rgba(255,255,255,0.12); border: none; color: var(--text); 
            font-size: 18px; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            cursor: pointer; display: flex; justify-content: center; align-items: center; 
            transition: background 0.2s, transform 0.36s var(--spring-gooey);
            box-shadow: inset 0 1px 10px rgba(255,255,255,0.16);
        }
        .close-btn:active { background: rgba(255,255,255,0.28); transform: scale(0.78) rotate(90deg); }

        #measurementList { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; 
            -webkit-overflow-scrolling: touch; scrollbar-width: none; 
        }
        #measurementList::-webkit-scrollbar { display: none; }

        /* =========================================
           КАРТОЧКИ LIQUID GLASS (ЭКРАН "ДЕНЬ")
           ========================================= */
        @keyframes liquidCardRise {
            0% { opacity: 0; transform: scale(0.94); border-radius: 32px; }
            100% { opacity: 1; transform: scale(1); }
        }

        .glass-card, .stat-box {
            position: relative;
            overflow: hidden;
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 58%, transparent 100%),
                radial-gradient(110% 70% at 85% 100%, rgba(10, 132, 255, 0.08) 0%, transparent 65%),
                rgba(20, 23, 32, 0.68);
            box-shadow: 
                0 16px 34px rgba(0, 0, 0, 0.44),
                inset 0 2px 18px rgba(255, 255, 255, 0.1);
            transition: transform 0.36s var(--spring-gooey), border-radius 0.36s var(--spring);
            will-change: transform;
        }
        .glass-card::before, .stat-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.16) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .glass-card:active, .stat-box:active {
            transform: scale(0.97);
            border-radius: 30px;
        }

        .glass-card {
            border-radius: 26px;
            padding: 16px;
            margin-bottom: 14px;
        }

        #dayView.active .anim-stagger-1 { animation: liquidCardRise 0.44s var(--spring) 0.04s backwards; }
        #dayView.active .anim-stagger-2 { animation: liquidCardRise 0.44s var(--spring) 0.08s backwards; }
        #dayView.active .anim-stagger-3 { animation: liquidCardRise 0.44s var(--spring) 0.12s backwards; }
        #dayView.active .anim-stagger-4 { animation: liquidCardRise 0.44s var(--spring) 0.16s backwards; }
        #dayView.active .anim-stagger-5 { animation: liquidCardRise 0.44s var(--spring) 0.20s backwards; }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-secondary);
        }

        .card-sub-hint {
            font-size: 11px; color: var(--text-secondary); font-weight: 500;
        }

        .glass-badge {
            font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
            box-shadow: inset 0 1px 10px rgba(255,255,255,0.16);
            transition: background 0.35s ease, color 0.35s ease, transform 0.42s var(--spring-gooey);
        }
        .glass-badge.pulse { transform: scale(1.14); }
        .zone-green { background: rgba(48, 209, 88, 0.24); color: var(--green); }
        .zone-orange { background: rgba(255, 159, 10, 0.24); color: var(--orange); }
        .zone-red { background: rgba(255, 69, 58, 0.24); color: var(--red); }

        .hero-row {
            display: flex; align-items: baseline; gap: 6px; margin: 4px 0 8px;
        }
        .hero-value {
            font-size: 48px; font-weight: 700; letter-spacing: -1.5px; line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .hero-unit {
            font-size: 16px; font-weight: 500; color: var(--text-secondary);
        }
        .hero-meta {
            font-size: 13px; color: var(--text-secondary);
        }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
        }
        .stat-box {
            border-radius: 22px;
            padding: 14px;
        }
        .stat-num {
            font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .glass-segmented {
            position: relative;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 3px;
            margin-bottom: 12px;
        }
        .seg-pill {
            position: absolute;
            top: 3px; bottom: 3px; left: 3px;
            width: calc((100% - 6px) / 3);
            background: radial-gradient(125% 95% at 30% 10%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.08) 100%);
            border-radius: 11px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.32), inset 0 1px 10px rgba(255,255,255,0.18);
            transition: transform 0.44s var(--spring-gooey);
            will-change: transform;
            pointer-events: none;
        }
        .glass-segmented button {
            position: relative; z-index: 1;
            flex: 1; border: none; background: transparent; color: var(--text-secondary);
            font-size: 12px; font-weight: 600; padding: 6px 0; border-radius: 11px;
            cursor: pointer; transition: color 0.25s ease, transform 0.25s var(--spring-gooey);
        }
        .glass-segmented button:active { transform: scale(0.88); }
        .glass-segmented button.active { color: var(--text); }

        .chart-wrap-day {
            height: 150px; position: relative;
        }

        .section-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-secondary); margin: 4px 4px 8px;
        }

        .day-list {
            display: flex; flex-direction: column; gap: 8px;
        }

        .measurement-item { 
            position: relative;
            content-visibility: auto;
            contain-intrinsic-size: 54px;
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 62%, transparent 100%),
                rgba(20, 23, 32, 0.68);
            padding: 15px 16px; border-radius: 20px; display: flex; flex-direction: column;
            flex-shrink: 0; box-shadow: 0 6px 16px rgba(0,0,0,0.26), inset 0 1px 14px rgba(255,255,255,0.08);
            cursor: pointer;
            transition: transform 0.36s var(--spring-gooey), border-radius 0.38s var(--spring), background 0.25s;
            will-change: transform;
        }
        .measurement-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.14) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .measurement-item:active {
            transform: scale(0.96);
            border-radius: 26px;
        }
        .measurement-item.open {
            content-visibility: visible;
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(100, 185, 255, 0.24) 0%, rgba(10, 132, 255, 0.06) 65%, transparent 100%),
                rgba(24, 29, 40, 0.84);
            border-radius: 26px;
        }

        .m-top-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }
        .m-right-wrap {
            display: flex; align-items: center; gap: 8px;
        }
        .m-chevron {
            font-size: 11px; color: var(--text-secondary);
            transition: transform 0.4s var(--spring-gooey), color 0.2s;
        }
        .measurement-item.open .m-chevron {
            transform: rotate(180deg);
            color: #64D2FF;
        }

        .m-expand-body {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-top: 0;
            transform: scale(0.94);
            transform-origin: top center;
            transition: max-height 0.46s var(--spring), opacity 0.26s ease, margin-top 0.34s var(--spring), transform 0.42s var(--spring);
        }
        .measurement-item.open .m-expand-body {
            max-height: 185px;
            opacity: 1;
            margin-top: 12px;
            transform: scale(1);
        }
        .m-chart-box {
            height: 130px;
            width: 100%;
            background: rgba(0, 0, 0, 0.28);
            border-radius: 16px;
            padding: 8px 10px 4px;
            box-sizing: border-box;
            position: relative;
        }
        .m-chart-caption {
            display: flex; justify-content: space-between;
            font-size: 11px; color: var(--text-secondary);
            margin-top: 6px; padding: 0 2px;
        }

        .m-time { color: var(--text-secondary); font-size: 15px; font-weight: 500; }
        .m-value { font-size: 17px; font-weight: 600; }

        /* =========================================
           КНОПКА + (FAB)
           ========================================= */
        #fabContainer {
            position: fixed; bottom: 30px; left: 20px;
            width: 56px; height: 56px;
            transform-origin: bottom left;
            background: 
                radial-gradient(135% 100% at 28% 12%, rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0.04) 68%),
                rgba(28, 32, 44, 0.72);
            backdrop-filter: blur(26px) saturate(200%) url(#liquidGlassFilter);
            -webkit-backdrop-filter: blur(26px) saturate(200%);
            box-shadow: 0 16px 36px rgba(0,0,0,0.54), inset 0 2px 16px rgba(255,255,255,0.24);
            border-radius: 28px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: width 0.5s var(--spring-gooey), height 0.5s var(--spring-gooey), border-radius 0.46s var(--spring), background 0.3s, transform 0.3s var(--spring-gooey);
            z-index: 500; overflow: hidden; cursor: pointer;
            will-change: width, height, transform, border-radius;
        }
        #fabContainer::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.22) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        
        #fabContainer:not(.expanded):active { transform: scale(0.84); }

        #fabContainer.expanded {
            width: 160px; height: 170px; border-radius: 30px;
            background: 
                radial-gradient(135% 100% at 28% 12%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.03) 68%),
                rgba(22, 25, 34, 0.86);
            box-shadow: 0 26px 54px rgba(0,0,0,0.74), inset 0 2px 18px rgba(255,255,255,0.2);
            cursor: default;
        }

        .fab-plus { 
            position: absolute; font-size: 32px; font-weight: 300; color: white; 
            transition: opacity 0.2s, transform 0.42s var(--spring-gooey); 
        }
        #fabContainer.expanded .fab-plus { opacity: 0; transform: rotate(135deg) scale(0.2); pointer-events: none; }

        .fab-menu-content {
            display: flex; flex-direction: column; gap: 7px; width: 100%; padding: 12px; box-sizing: border-box;
            opacity: 0; pointer-events: none;
            transition: opacity 0.22s ease;
        }
        
        #fabContainer.expanded .fab-menu-content { 
            opacity: 1; pointer-events: auto; 
            transition-delay: 0.06s; 
        }

        .fab-action-btn {
            background: rgba(255,255,255,0.08); border: none; padding: 10px 14px; border-radius: 16px; color: white;
            display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 500;
            box-shadow: inset 0 1px 10px rgba(255,255,255,0.1);
            cursor: pointer; 
            opacity: 0; transform: scale(0.86);
            transition: background 0.18s, transform 0.36s var(--spring-gooey), opacity 0.22s; 
            width: 100%;
        }
        #fabContainer.expanded .fab-action-btn { opacity: 1; transform: scale(1); }
        #fabContainer.expanded .fab-action-btn:nth-child(1) { transition-delay: 0.05s; }
        #fabContainer.expanded .fab-action-btn:nth-child(2) { transition-delay: 0.09s; }
        #fabContainer.expanded .fab-action-btn:nth-child(3) { transition-delay: 0.13s; }

        .fab-action-btn:active { background: rgba(255,255,255,0.24); transform: scale(0.9) !important; }

        .chart-container { 
            position: relative;
            flex: 1; width: 100%; height: 100%; 
            background: 
                radial-gradient(135% 90% at 25% 0%, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 60%, transparent 100%),
                rgba(20, 23, 32, 0.72);
            border-radius: 26px; padding: 15px; 
            box-sizing: border-box;
            box-shadow: inset 0 2px 18px rgba(255,255,255,0.1);
        }
        .chart-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.04) 48%, rgba(255,255,255,0.16) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute;pointer-events:none">
        <defs>
            <filter id="liquidGlassFilter" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="3" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <div class="ambient-canvas">
        <div class="liquid-blob blob-1"></div>
        <div class="liquid-blob blob-2"></div>
        <div class="liquid-blob blob-3"></div>
    </div>

    <!-- КАЛЕНДАРЬ -->
    <div id="calendarView" class="view active">
        <div class="header">
            <button id="prevBtn">&#8249;</button>
            <span id="monthTitle"></span>
            <button id="nextBtn">&#8250;</button>
        </div>
        <div class="weekdays">
            <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div class="weekends">СБ</div><div class="weekends">ВС</div>
        </div>
        <div class="calendar" id="calendarGrid"></div>
    </div>

    <!-- МЕСЯЧНЫЙ ГРАФИК -->
    <div id="graphView" class="view">
        <div class="header">
            <button id="prevMonthGraph">&#8249;</button>
            <span id="monthTitleGraph"></span>
            <button id="nextMonthGraph">&#8250;</button>
        </div>
        <div class="chart-container">
            <canvas id="monthlyChart"></canvas>
        </div>
    </div>

    <!-- ДЕНЬ (LIQUID GLASS) -->
    <div id="dayView" class="view">
        <div class="header">
            <span>День</span>
            <button id="refreshDayBtn" class="refresh-glass-btn" onclick="loadData(true)"><span class="refresh-icon">↻</span> Обновить</button>
        </div>

        <div class="glass-card anim-stagger-1">
            <div class="card-header">
                <span class="card-title">Последний выдох</span>
                <span id="zoneBadge" class="glass-badge zone-green">Норма</span>
            </div>
            <div class="hero-row">
                <span id="lastFlow" class="hero-value">—</span>
                <span class="hero-unit">л/мин</span>
            </div>
            <div id="lastTime" class="hero-meta">Загрузка точек с ESP32...</div>
        </div>

        <div class="stats-grid anim-stagger-2">
            <div class="stat-box">
                <div class="card-title">Лучший (норма)</div>
                <div class="stat-num"><span id="bestFlowNum">400</span> <span style="font-size:13px;font-weight:500;color:var(--text-secondary)">л/м</span></div>
            </div>
            <div class="stat-box">
                <div class="card-title">Средний пик</div>
                <div class="stat-num"><span id="avgFlowNum">—</span> <span style="font-size:13px;font-weight:500;color:var(--text-secondary)">л/м</span></div>
            </div>
        </div>

        <div class="glass-card anim-stagger-3">
            <div class="card-header">
                <span class="card-title">Интенсивность выдоха</span>
                <span id="intensityMeta" class="card-sub-hint">Последний замер</span>
            </div>
            <div class="chart-wrap-day" style="height:140px">
                <canvas id="intensityMainChart"></canvas>
            </div>
        </div>

        <div class="glass-card anim-stagger-4">
            <div class="card-header">
                <span class="card-title">Динамика ПСВ</span>
            </div>
            <div class="glass-segmented">
                <div id="segPill" class="seg-pill"></div>
                <button class="active" onclick="setDayRange(7, 0, this)">7 замеров</button>
                <button onclick="setDayRange(20, 1, this)">20 замеров</button>
                <button onclick="setDayRange(100, 2, this)">Все</button>
            </div>
            <div class="chart-wrap-day">
                <canvas id="dayChart"></canvas>
            </div>
        </div>

        <div class="section-label anim-stagger-5">
            <span>Все замеры</span>
            <span id="totalRecordsCount" style="color:#64D2FF"></span>
        </div>
        <div id="dayHistoryList" class="day-list anim-stagger-5"></div>
    </div>

    <!-- FAB МЕНЮ -->
    <div id="fabContainer" onclick="toggleFab(event)">
        <div class="fab-plus">+</div>
        <div class="fab-menu-content">
            <button class="fab-action-btn" onclick="switchToView('day', event)">📊 День</button>
            <button class="fab-action-btn" onclick="switchToView('graph', event)">📈 График</button>
            <button class="fab-action-btn" onclick="switchToView('calendar', event)">📅 Календарь</button>
        </div>
    </div>

    <!-- Затемнение фона при раскрытии ячейки -->
    <div id="modalBackdrop" onclick="closeExpandedCell()"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxh0Poo3SwCP1-2wyQtV5BfGbxvOTKG012sbCPbNlRe-ay82MaTmHbT1ComA1CXT3Wv_Q/exec";
        const PERSONAL_BEST = 400;

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let allData = {};
        let flatRecords = [];
        let monthlyChartInstance = null;
        let dayChartInstance = null;
        let intensityMainChartInstance = null;
        let inlineCharts = {};
        let dayRangeLimit = 7;
        let currentView = 'calendar';

        // Состояние раскрытой ячейки (1-в-1 как кнопка +)
        let activeCell = null;
        let activePlaceholder = null;
        let activeCellOriginRect = null;
        let restoreTimer = null;

        function haptic(type = 'light') {
            if (!tg?.HapticFeedback) return;
            if (type === 'selection') tg.HapticFeedback.selectionChanged();
            else tg.HapticFeedback.impactOccurred(type);
        }

        function animateValue(el, target, duration = 520) {
            const start = Number(el.innerText) || 0;
            if (start === target) { el.innerText = target; return; }
            const startTime = performance.now();
            function step(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 4);
                el.innerText = Math.round(start + (target - start) * ease);
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function parseAnyDate(raw) {
            if (!raw) return null;
            if (raw instanceof Date && !isNaN(raw.getTime())) return raw;

            const str = String(raw).trim();
            const m = str.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:[,\sT]+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
            if (m) {
                return new Date(
                    Number(m[3]),
                    Number(m[2]) - 1,
                    Number(m[1]),
                    Number(m[4] || 0),
                    Number(m[5] || 0),
                    Number(m[6] || 0)
                );
            }

            const d = new Date(str);
            if (!isNaN(d.getTime())) return d;
            return null;
        }

        function parsePoints(rawPoints, peakFlow) {
            if (Array.isArray(rawPoints) && rawPoints.length >= 2) {
                return rawPoints.map(Number).filter(n => !isNaN(n));
            }
            if (typeof rawPoints === 'string') {
                const trimmed = rawPoints.trim();
                if (trimmed.startsWith('[')) {
                    try {
                        const arr = JSON.parse(trimmed);
                        if (Array.isArray(arr) && arr.length >= 2) {
                            return arr.map(Number).filter(n => !isNaN(n));
                        }
                    } catch (e) {}
                }
            }
            const p = Number(peakFlow) || 0;
            return [0, p * 0.45, p * 0.86, p, p * 0.82, p * 0.58, p * 0.34, p * 0.14, 0];
        }

        function getSampleStepSec(pointsLength) {
            return pointsLength > 80 ? 0.01 : 0.05;
        }

        function buildIntensityLabels(count) {
            const dt = getSampleStepSec(count);
            return Array.from({ length: count }, (_, i) => ((i * dt).toFixed(2) + 'с'));
        }

        function drawIntensityChart(canvasEl, points, color, existingChart = null) {
            if (!canvasEl) return null;
            let trimmed = [...points];
            while (trimmed.length > 8 && trimmed[trimmed.length - 1] === 0 && trimmed[trimmed.length - 2] === 0 && trimmed[trimmed.length - 3] === 0) {
                trimmed.pop();
            }
            const labels = buildIntensityLabels(trimmed.length);
            const showDots = trimmed.length <= 70 ? 2 : 0;

            if (existingChart) {
                existingChart.data.labels = labels;
                existingChart.data.datasets[0].data = trimmed;
                existingChart.data.datasets[0].borderColor = color;
                existingChart.data.datasets[0].backgroundColor = color + '32';
                existingChart.data.datasets[0].pointRadius = showDots;
                existingChart.data.datasets[0].pointBackgroundColor = color;
                existingChart.update();
                return existingChart;
            }

            return new Chart(canvasEl.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: trimmed,
                        borderColor: color,
                        backgroundColor: color + '32',
                        borderWidth: 2.5,
                        pointRadius: showDots,
                        pointHoverRadius: 5,
                        pointBackgroundColor: color,
                        pointBorderWidth: 0,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 420, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            ticks: { color: 'rgba(235,235,245,0.58)', font: { size: 9 }, maxTicksLimit: 6 },
                            grid: { display: false }
                        },
                        y: {
                            min: 0,
                            ticks: { color: 'rgba(235,235,245,0.58)', font: { size: 10 }, maxTicksLimit: 4 },
                            grid: { color: 'rgba(255,255,255,0.07)' }
                        }
                    }
                }
            });
        }

        function toggleFab(e) {
            if (e.target.id === 'fabContainer' || e.target.classList.contains('fab-plus')) {
                haptic('light');
                document.getElementById('fabContainer').classList.toggle('expanded');
            }
        }

        document.addEventListener('click', function(event) {
            const fab = document.getElementById('fabContainer');
            if (fab.classList.contains('expanded') && !fab.contains(event.target)) {
                fab.classList.remove('expanded');
            }
        });

        function switchToView(target, e) {
            if(e) e.stopPropagation(); 
            document.getElementById('fabContainer').classList.remove('expanded');
            if (activeCell) closeExpandedCell(true);
            if (currentView === target) return;
            haptic('selection');

            document.getElementById('calendarView').classList.remove('active');
            document.getElementById('graphView').classList.remove('active');
            document.getElementById('dayView').classList.remove('active');

            if (target === 'graph') {
                document.getElementById('graphView').classList.add('active');
                currentView = 'graph';
                renderMonthlyGraph();
            } else if (target === 'day') {
                document.getElementById('dayView').classList.add('active');
                currentView = 'day';
                renderDayView(true);
            } else {
                document.getElementById('calendarView').classList.add('active');
                currentView = 'calendar';
                renderCalendar();
            }
        }

        async function loadData(withHaptic = false) {
            const btn = document.getElementById('refreshDayBtn');
            if (withHaptic) {
                haptic('medium');
                if (btn) {
                    btn.classList.remove('spinning');
                    void btn.offsetWidth;
                    btn.classList.add('spinning');
                }
            }
            document.getElementById('lastTime').innerText = 'Загрузка точек с ESP32...';
            try {
                const response = await fetch(scriptUrl + "?action=getData");
                const data = await response.json();
                allData = {};
                flatRecords = [];

                for (let i = 0; i < data.length; i++) {
                    const dateObj = parseAnyDate(data[i][0]); 
                    const flow = parseFloat(String(data[i][1]).replace(',', '.')); 
                    if (!dateObj || isNaN(flow) || flow <= 0) continue; 
                    
                    const points = parsePoints(data[i][2], flow);
                    const dateKey = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
                    const timeStr = String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0') + ':' + String(dateObj.getSeconds()).padStart(2, '0');
                    const shortTime = String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0');
                    const fullDate = String(dateObj.getDate()).padStart(2, '0') + '.' + String(dateObj.getMonth()+1).padStart(2, '0') + ' • ' + shortTime;
                    const hour = dateObj.getHours();
                    
                    const rec = { ts: dateObj.getTime(), time: timeStr, fullDate: fullDate, shortTime: shortTime, flow: flow, hour: hour, points: points };
                    if (!allData[dateKey]) allData[dateKey] = [];
                    allData[dateKey].push(rec);
                    flatRecords.push(rec);
                }

                flatRecords.sort((a, b) => b.ts - a.ts);
                renderCalendar();
                if (currentView === 'graph') renderMonthlyGraph();
                renderDayView(true);
            } catch (error) {
                console.error("Ошибка загрузки", error);
                document.getElementById('lastTime').innerText = 'Ошибка загрузки';
                renderCalendar();
            }
        }

        function renderCalendar() {
            if (activeCell) closeExpandedCell(true);
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('monthTitle').innerText = monthNames[currentMonth] + " " + currentYear;
            document.getElementById('monthTitleGraph').innerText = monthNames[currentMonth] + " " + currentYear;
            
            const grid = document.getElementById('calendarGrid');
            const frag = document.createDocumentFragment();
            let firstDay = new Date(currentYear, currentMonth, 1).getDay();
            let startDay = firstDay === 0 ? 7 : firstDay; 
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            for (let i = 1; i < startDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day-cell empty-cell';
                frag.appendChild(emptyDiv);
            }
            
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.style.animationDelay = `${Math.min(day * 0.01, 0.3)}s`;
                if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) cell.classList.add('today');
                
                const dateKey = currentYear + '-' + String(currentMonth+1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const measurements = allData[dateKey] || [];
                
                if (measurements.length > 0) {
                    cell.classList.add('has-data');
                    const maxFlow = Math.max(...measurements.map(m => m.flow));
                    const colorClass = maxFlow >= 320 ? 'val-green' : 'val-blue';
                    cell.innerHTML = `<span class="day-num">${day}</span><span class="day-val ${colorClass}">${Math.round(maxFlow)}</span>`;
                } else {
                    cell.innerHTML = `<span class="day-num">${day}</span>`;
                }
                
                cell.addEventListener('click', function(e) {
                    if (this.classList.contains('morphing-cell')) return;
                    openCellMorph(this, day, measurements);
                });
                frag.appendChild(cell);
            }
            grid.innerHTML = '';
            grid.appendChild(frag);
        }

        function renderMonthlyGraph() {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            let labels = [];
            let morningData = [];
            let eveningData = [];

            for (let day = 1; day <= daysInMonth; day++) {
                labels.push(day);
                const dateKey = currentYear + '-' + String(currentMonth+1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const measurements = allData[dateKey];
                
                if (measurements && measurements.length > 0) {
                    const morning = measurements.filter(m => m.hour < 12);
                    const evening = measurements.filter(m => m.hour >= 12);
                    morningData.push(morning.length > 0 ? Math.max(...morning.map(m => m.flow)) : null);
                    eveningData.push(evening.length > 0 ? Math.max(...evening.map(m => m.flow)) : null);
                } else {
                    morningData.push(null);
                    eveningData.push(null);
                }
            }

            if (monthlyChartInstance) monthlyChartInstance.destroy();

            monthlyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Утро',
                            data: morningData,
                            borderColor: '#30D158',
                            backgroundColor: 'rgba(48, 209, 88, 0.14)',
                            borderWidth: 3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#30D158',
                            tension: 0.4,
                            spanGaps: true,
                            fill: false
                        },
                        {
                            label: 'День/Вечер',
                            data: eveningData,
                            borderColor: '#0A84FF',
                            backgroundColor: 'rgba(10, 132, 255, 0.14)',
                            borderWidth: 3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#0A84FF',
                            tension: 0.4,
                            spanGaps: true,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 550, easing: 'easeOutQuart' },
                    plugins: { legend: { display: true, labels: { color: 'rgba(235,235,245,0.75)' } } },
                    scales: {
                        x: { ticks: { color: 'rgba(235,235,245,0.58)', stepSize: 1, autoSkip: false, maxRotation: 90, minRotation: 90 }, grid: { display: false } },
                        y: { min: 0, max: 1000, ticks: { color: 'rgba(235,235,245,0.58)', stepSize: 50 }, grid: { color: 'rgba(255,255,255,0.07)' } }
                    }
                }
            });
        }

        function getZone(flow) {
            const pct = (flow / PERSONAL_BEST) * 100;
            if (pct >= 80) return { label: 'Зелёная зона', cls: 'zone-green', color: '#30D158' };
            if (pct >= 50) return { label: 'Жёлтая зона', cls: 'zone-orange', color: '#FF9F0A' };
            return { label: 'Красная зона', cls: 'zone-red', color: '#FF453A' };
        }

        function createExpandableMeasurementCard(m, labelText, uid, onSelectCallback = null) {
            const z = getZone(m.flow);
            const item = document.createElement('div');
            item.className = 'measurement-item';

            const activePointsCount = m.points.filter(v => v > 0).length;
            const dt = getSampleStepSec(m.points.length);
            const durationSec = (activePointsCount * dt).toFixed(2);
            item.innerHTML = `
                <div class="m-top-row">
                    <span class="m-time">🕒 ${labelText}</span>
                    <div class="m-right-wrap">
                        <span class="m-value" style="color:${z.color}">${Math.round(m.flow)} л/м</span>
                        <span class="m-chevron">▾</span>
                    </div>
                </div>
                <div class="m-expand-body">
                    <div class="m-chart-box">
                        <canvas id="canvas_${uid}"></canvas>
                    </div>
                    <div class="m-chart-caption">
                        <span>Точек выдоха: ${activePointsCount}</span>
                        <span>Время выдоха: ${durationSec} с</span>
                    </div>
                </div>
            `;

            item.addEventListener('click', (e) => {
                e.stopPropagation();
                haptic('selection');
                const wasOpen = item.classList.contains('open');

                item.parentElement.querySelectorAll('.measurement-item.open').forEach(el => {
                    el.classList.remove('open');
                });

                if (!wasOpen) {
                    item.classList.add('open');
                    requestAnimationFrame(() => {
                        const canvas = item.querySelector(`#canvas_${uid}`);
                        if (inlineCharts[uid]) {
                            inlineCharts[uid].destroy();
                        }
                        inlineCharts[uid] = drawIntensityChart(canvas, m.points, z.color);
                    });
                }

                if (onSelectCallback) {
                    onSelectCallback(m);
                }
            });

            return item;
        }

        function setDayRange(limit, index, btn) {
            if (dayRangeLimit === limit) return;
            haptic('selection');
            dayRangeLimit = limit;

            document.getElementById('segPill').style.transform = `translate3d(${index * 100}%, 0, 0)`;

            document.querySelectorAll('#dayView .glass-segmented button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDayChartOnly();
        }

        function updateDayChartOnly() {
            const slice = flatRecords.slice(0, dayRangeLimit).reverse();
            const labels = slice.map(r => r.shortTime);
            const values = slice.map(r => r.flow);
            const colors = slice.map(r => getZone(r.flow).color);

            if (dayChartInstance) {
                dayChartInstance.data.labels = labels;
                dayChartInstance.data.datasets[0].data = values;
                dayChartInstance.data.datasets[0].pointBackgroundColor = colors;
                dayChartInstance.update();
            }
        }

        function selectMainIntensityRecord(rec) {
            const z = getZone(rec.flow);
            document.getElementById('intensityMeta').innerText = `${rec.fullDate} • пик ${Math.round(rec.flow)} л/м`;
            const canvas = document.getElementById('intensityMainChart');
            intensityMainChartInstance = drawIntensityChart(canvas, rec.points, z.color, intensityMainChartInstance);
        }

        function renderDayView(withCounter = true) {
            const listEl = document.getElementById('dayHistoryList');
            document.getElementById('totalRecordsCount').innerText = flatRecords.length ? `${flatRecords.length} шт.` : '';

            if (!flatRecords.length) {
                document.getElementById('lastFlow').innerText = '0';
                document.getElementById('lastTime').innerText = 'Замеров в таблице пока нет';
                document.getElementById('avgFlowNum').innerText = '0';
                listEl.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding:16px; font-size:14px;">Нет данных</div>`;
                return;
            }

            const latest = flatRecords[0];
            const zone = getZone(latest.flow);
            const heroEl = document.getElementById('lastFlow');
            const bestEl = document.getElementById('bestFlowNum');
            const avgEl = document.getElementById('avgFlowNum');

            const bestVal = PERSONAL_BEST;
            const avgVal = Math.round(flatRecords.reduce((s, r) => s + r.flow, 0) / flatRecords.length);

            if (withCounter) {
                animateValue(heroEl, Math.round(latest.flow), 520);
                animateValue(bestEl, bestVal, 520);
                animateValue(avgEl, avgVal, 520);
            } else {
                heroEl.innerText = Math.round(latest.flow);
                bestEl.innerText = bestVal;
                avgEl.innerText = avgVal;
            }

            document.getElementById('lastTime').innerText = latest.fullDate;

            const badge = document.getElementById('zoneBadge');
            badge.innerText = zone.label;
            badge.className = 'glass-badge ' + zone.cls + ' pulse';
            setTimeout(() => badge.classList.remove('pulse'), 320);

            selectMainIntensityRecord(latest);

            const frag = document.createDocumentFragment();
            flatRecords.forEach((item, idx) => {
                const card = createExpandableMeasurementCard(
                    item,
                    item.fullDate,
                    `day_${idx}`,
                    (selectedRec) => selectMainIntensityRecord(selectedRec)
                );
                frag.appendChild(card);
            });
            listEl.innerHTML = '';
            listEl.appendChild(frag);

            const slice = flatRecords.slice(0, dayRangeLimit).reverse();
            const ctx = document.getElementById('dayChart').getContext('2d');

            if (dayChartInstance) {
                updateDayChartOnly();
                return;
            }

            dayChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: slice.map(r => r.shortTime),
                    datasets: [{
                        data: slice.map(r => r.flow),
                        borderColor: '#0A84FF',
                        backgroundColor: 'rgba(10, 132, 255, 0.2)',
                        borderWidth: 3,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: slice.map(r => getZone(r.flow).color),
                        pointBorderColor: '#fff',
                        fill: true,
                        tension: 0.42
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 480, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: 'rgba(235,235,245,0.58)', font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: 'rgba(235,235,245,0.58)', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.07)' } }
                    }
                }
            });
        }

        // ============================================================
        // САМА ЯЧЕЙКА РАЗДУВАЕТСЯ В ОКНО (1-В-1 КАК КНОПКА +)
        // ============================================================
        function openCellMorph(cellElement, day, measurements) {
            haptic('light');
            if (activeCell) closeExpandedCell(true);

            const rect = cellElement.getBoundingClientRect();
            activeCell = cellElement;
            activeCellOriginRect = rect;

            // Вставляем плейсхолдер в сетку, чтобы остальные ячейки не сдвинулись
            const placeholder = document.createElement('div');
            placeholder.className = 'day-cell-placeholder';
            cellElement.parentNode.insertBefore(placeholder, cellElement);
            activePlaceholder = placeholder;

            // Переносим саму ячейку в body, чтобы transform у #calendarView не сбивал fixed
            document.body.appendChild(cellElement);

            const monthNames = ["Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"];
            const inner = document.createElement('div');
            inner.className = 'cell-modal-inner';
            inner.innerHTML = `
                <div class="expanded-header">
                    <div class="expanded-title">${day} ${monthNames[currentMonth]}</div>
                    <button class="close-btn" type="button">×</button>
                </div>
                <div id="measurementList"></div>
            `;
            inner.querySelector('.close-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                closeExpandedCell(false);
            });

            const list = inner.querySelector('#measurementList');
            if (measurements.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = "text-align:center; color:var(--text-secondary); margin-top:20px; font-size:15px;";
                empty.innerText = "Нет данных";
                list.appendChild(empty);
            } else {
                const sorted = [...measurements].sort((a, b) => a.time.localeCompare(b.time));
                sorted.forEach((m, idx) => {
                    list.appendChild(createExpandableMeasurementCard(m, m.time, `modal_${day}_${idx}`));
                });
            }
            cellElement.appendChild(inner);

            // Стартовые координаты ячейки
            cellElement.style.transition = 'none';
            cellElement.style.top = rect.top + 'px';
            cellElement.style.left = rect.left + 'px';
            cellElement.style.width = rect.width + 'px';
            cellElement.style.height = rect.height + 'px';
            cellElement.style.borderRadius = '20px';
            cellElement.classList.add('morphing-cell');
            cellElement.offsetHeight;

            document.getElementById('modalBackdrop').classList.add('active');

            // Раздуваем саму ячейку на весь экран (как кнопка +)
            requestAnimationFrame(() => {
                cellElement.style.transition = 'top 0.44s var(--spring), left 0.44s var(--spring), width 0.44s var(--spring), height 0.44s var(--spring), border-radius 0.44s var(--spring)';
                cellElement.classList.add('is-open');
                cellElement.style.top = '8vh';
                cellElement.style.left = '18px';
                cellElement.style.width = 'calc(100vw - 36px)';
                cellElement.style.height = '84vh';
                cellElement.style.borderRadius = '30px';
            });
        }

        function closeExpandedCell(instant = false) {
            if (!activeCell) return;
            if (!instant) haptic('light');
            if (restoreTimer) {
                clearTimeout(restoreTimer);
                restoreTimer = null;
            }

            const cell = activeCell;
            const placeholder = activePlaceholder;
            const rect = placeholder ? placeholder.getBoundingClientRect() : activeCellOriginRect;

            document.getElementById('modalBackdrop').classList.remove('active');
            cell.classList.remove('is-open');

            const finishRestore = () => {
                const inner = cell.querySelector('.cell-modal-inner');
                if (inner) inner.remove();

                cell.classList.remove('morphing-cell');
                cell.style.transition = 'none';
                cell.style.top = '';
                cell.style.left = '';
                cell.style.width = '';
                cell.style.height = '';
                cell.style.borderRadius = '';

                if (placeholder && placeholder.parentNode) {
                    placeholder.parentNode.insertBefore(cell, placeholder);
                    placeholder.remove();
                }

                requestAnimationFrame(() => {
                    cell.style.transition = '';
                });

                activeCell = null;
                activePlaceholder = null;
                activeCellOriginRect = null;
            };

            if (instant || !rect) {
                finishRestore();
                return;
            }

            cell.style.transition = 'top 0.38s var(--spring), left 0.38s var(--spring), width 0.38s var(--spring), height 0.38s var(--spring), border-radius 0.38s var(--spring)';
            cell.style.top = rect.top + 'px';
            cell.style.left = rect.left + 'px';
            cell.style.width = rect.width + 'px';
            cell.style.height = rect.height + 'px';
            cell.style.borderRadius = '20px';

            restoreTimer = setTimeout(finishRestore, 390);
        }

        document.getElementById('prevBtn').addEventListener('click', () => { haptic('selection'); currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); });
        document.getElementById('nextBtn').addEventListener('click', () => { haptic('selection'); currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); });
        document.getElementById('prevMonthGraph').addEventListener('click', () => { haptic('selection'); currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); renderMonthlyGraph(); });
        document.getElementById('nextMonthGraph').addEventListener('click', () => { haptic('selection'); currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); renderMonthlyGraph(); });

        loadData();
    </script>
</body>
</html>
