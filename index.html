<!-- ================= НАЧАЛО КОДА (ВЕРСИЯ 38 - MOBILE GHOST CLICK KILLER) ================= -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <style>
        /* =========================================
           ГЛОБАЛЬНЫЕ СТИЛИ (iOS DARK MODE)
           ========================================= */
        :root {
            --ios-bg: #000000;
            --ios-card: #1C1C1E;
            --ios-text: #FFFFFF;
            --ios-text-secondary: #8E8E93;
            --ios-blue: #0A84FF;
            --ios-red: #FF453A;
            --ios-glass: rgba(28, 28, 30, 0.75);
            --ios-glass-border: rgba(255, 255, 255, 0.1);
            --ios-spring: cubic-bezier(0.32, 0.72, 0, 1);
        }

        body { 
            background-color: var(--ios-bg); 
            color: var(--ios-text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh; box-sizing: border-box;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; 
        }

        /* ЯДЕРНАЯ БЛОКИРОВКА: пока класс locked на body, нихуя не нажимается */
        body.locked * {
            pointer-events: none !important;
        }

        /* =========================================
           ОБЕРТКА И ЭКРАНЫ
           ========================================= */
        #appWrapper { position: relative; width: 100%; height: 100%; overflow: hidden; background-color: var(--ios-bg); }
        
        .view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box;
            background-color: var(--ios-bg);
            opacity: 0; pointer-events: none; z-index: 1;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            transition: clip-path 0.6s var(--ios-spring);
        }
        
        .view.active { opacity: 1; pointer-events: auto; z-index: 10; }

        /* =========================================
           ШАПКА
           ========================================= */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
            position: relative; z-index: 1; flex-shrink: 0;
        }
        .header button { 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: none; color: var(--ios-text); font-size: 18px; font-weight: 500;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.2s, transform 0.1s;
        }
        .header button:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }

        /* =========================================
           КАЛЕНДАРЬ
           ========================================= */
        .weekdays { 
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; 
            font-weight: 500; margin-bottom: 8px; color: var(--ios-text-secondary); font-size: 13px; 
            position: relative; z-index: 1; flex-shrink: 0; 
        }
        .weekends { color: var(--ios-red); }
        
        .calendar { 
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; 
            position: relative; z-index: 1; align-content: start; 
        }

        .day-cell { 
            width: 100%; aspect-ratio: 1 / 1; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 18px; position: relative; cursor: pointer;
            background: var(--ios-card); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.15s var(--ios-spring), background 0.2s;
        }
        .day-cell:active { transform: scale(0.9); background: #2C2C2E; }
        .day-cell.today { background: var(--ios-blue); box-shadow: 0 4px 10px rgba(10, 132, 255, 0.4); }
        .day-num { font-size: 17px; font-weight: 500; color: var(--ios-text); }
        .day-val { font-size: 10px; font-weight: 600; color: var(--ios-red); position: absolute; bottom: 4px; }
        .day-cell.today .day-val { color: rgba(255,255,255,0.8); }
        .empty-cell { background: transparent; border: none; box-shadow: none; cursor: default; }
        .empty-cell:active { transform: none; background: transparent; }

        /* =========================================
           FAB МЕНЮ
           ========================================= */
        #fabContainer {
            position: fixed; bottom: 30px; left: 20px;
            width: 56px; height: 56px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            border-radius: 28px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: width 0.4s var(--ios-spring), height 0.4s var(--ios-spring), border-radius 0.4s var(--ios-spring);
            z-index: 500; overflow: hidden; cursor: pointer;
        }
        
        #fabContainer.expanded {
            width: 120px; height: 110px; border-radius: 24px;
            background: rgba(30, 30, 30, 0.85);
            cursor: default;
        }

        .fab-plus {
            position: absolute; font-size: 32px; font-weight: 300; color: white;
            transition: opacity 0.2s, transform 0.3s var(--ios-spring);
        }
        #fabContainer.expanded .fab-plus { opacity: 0; transform: rotate(45deg) scale(0.5); pointer-events: none; }

        .fab-menu-content {
            display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 12px; box-sizing: border-box;
            opacity: 0; pointer-events: none; transform: scale(0.8) translateY(10px);
            transition: opacity 0.2s, transform 0.4s var(--ios-spring);
        }
        
        #fabContainer.expanded .fab-menu-content { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); transition-delay: 0.05s; }

        .fab-action-btn {
            background: rgba(255,255,255,0.08); border: none; padding: 10px 14px; border-radius: 12px; color: white;
            display: flex; align-items: center; justify-content: flex-start; gap: 8px; font-size: 15px; font-weight: 500;
            cursor: pointer; transition: background 0.2s, transform 0.1s; width: 100%;
        }
        .fab-action-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.96); }

        /* =========================================
           ГРАФИК ЗА МЕСЯЦ
           ========================================= */
        .chart-container { 
            flex: 1; position: relative; width: 100%; height: 100%; 
            background: var(--ios-card); border-radius: 20px; padding: 15px; 
            box-sizing: border-box; 
        }

        /* =========================================
           УВЕДОМЛЕНИЕ
           ========================================= */
        #toast {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%) translateY(-20px) scale(0.9);
            background: rgba(60, 60, 60, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 12px 24px;
            color: white; font-size: 15px; font-weight: 500; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.4s var(--ios-spring);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

        /* =========================================
           МОДАЛЬНОЕ ОКНО
           ========================================= */
        #expandedView { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 1000; pointer-events: none; opacity: 0; transition: opacity 0.3s; 
        }
        
        #expandedView::before { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.5); 
            opacity: 0; transition: opacity 0.3s; 
        }
        
        #modalContent {
            position: absolute; top: 10vh; bottom: 10vh; left: 20px; right: 20px;
            background: var(--ios-glass);
            backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 24px; border: 1px solid var(--ios-glass-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow: hidden;
            clip-path: inset(50% 50% 50% 50% round 20px); 
            will-change: clip-path; transform: translateZ(0); 
            transition: clip-path 0.6s var(--ios-spring);
        }
        
        #expandedView.active { pointer-events: auto; opacity: 1; }
        #expandedView.active::before { opacity: 1; }
        
        #modalInner { 
            display: flex; flex-direction: column; height: 100%; min-height: 0;
            opacity: 0; transition: opacity 0.3s ease; 
        }

        .expanded-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; z-index: 100; }
        .expanded-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .close-btn { 
            background: rgba(255,255,255,0.15); border: none; color: var(--ios-text); 
            font-size: 20px; font-weight: 500; width: 32px; height: 32px; border-radius: 50%; 
            cursor: pointer; display: flex; justify-content: center; align-items: center; transition: background 0.2s;
        }
        .close-btn:active { background: rgba(255,255,255,0.3); }

        #innerViewsWrapper { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 16px; }
        
        #listView { 
            position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 10; transition: opacity 0.3s;
        }
        #measurementList { 
            flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; 
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        #measurementList::-webkit-scrollbar { display: none; }
        
        .measurement-item { 
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.05);
            padding: 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer; flex-shrink: 0; transition: background 0.2s, transform 0.1s;
        }
        .measurement-item:active { background: rgba(255,255,255,0.15); transform: scale(0.98); }
        .m-time { color: var(--ios-text-secondary); font-size: 15px; font-weight: 500; }
        .m-value { color: var(--ios-red); font-size: 17px; font-weight: 600; }

        #graphContainer { 
            position: absolute; inset: 0; display: none; flex-direction: column; z-index: 999; 
            background: var(--ios-card); border-radius: 16px; padding: 15px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1);
            clip-path: inset(50% 50% 50% 50% round 16px); will-change: clip-path, opacity; transform: translateZ(0);
            transition: clip-path 0.5s var(--ios-spring), opacity 0.2s;
        }
        .back-btn {
            background: rgba(255,255,255,0.1); border: none; color: var(--ios-blue);
            font-size: 15px; font-weight: 500; padding: 10px 16px; border-radius: 12px;
            margin-bottom: 15px; cursor: pointer; align-self: flex-start; flex-shrink: 0;
            display: flex; align-items: center; gap: 4px; transition: background 0.2s;
        }
        .back-btn:active { background: rgba(255,255,255,0.2); }
        .chart-wrapper { flex: 1; position: relative; width: 100%; height: 100%; min-height: 0; }
    </style>
</head>
<body>

    <div id="appWrapper">
        <div id="calendarView" class="view active">
            <div class="header">
                <button id="prevBtn">&#8249;</button>
                <span id="monthTitle"></span>
                <button id="nextBtn">&#8250;</button>
            </div>
            <div class="weekdays">
                <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div class="weekends">СБ</div><div class="weekends">ВС</div>
            </div>
            <div class="calendar" id="calendarGrid"></div>
        </div>

        <div id="graphView" class="view">
            <div class="header">
                <button id="prevMonthGraph">&#8249;</button>
                <span id="monthTitleGraph"></span>
                <button id="nextMonthGraph">&#8250;</button>
            </div>
            <div class="chart-container">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Кнопка FAB -->
    <div id="fabContainer" onclick="toggleFab(event)">
        <div class="fab-plus">+</div>
        <div class="fab-menu-content">
            <!-- Заменили onclick на ontouchstart и onclick для надежности на мобилках -->
            <button class="fab-action-btn" onclick="switchToView('graph', event)">📈 График</button>
            <button class="fab-action-btn" onclick="switchToView('calendar', event)">📅 Календарь</button>
        </div>
    </div>

    <div id="toast">Вы уже находитесь здесь</div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="expandedView" onclick="closeExpandedView()">
        <div id="modalContent" onclick="event.stopPropagation()">
            
            <div id="modalInner">
                <div class="expanded-header">
                    <div class="expanded-title" id="sheetDateTitle">Дата</div>
                    <button class="close-btn" onclick="closeExpandedView()">×</button>
                </div>

                <div id="innerViewsWrapper">
                    <div id="listView">
                        <div id="measurementList"></div>
                    </div>
                    <div id="graphContainer">
                        <button class="back-btn" onclick="showListView()">← Назад</button>
                        <div class="expanded-title" id="graphTitle" style="margin-bottom: 15px; flex-shrink: 0;">График</div>
                        <div class="chart-wrapper">
                            <canvas id="breathChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxh0Poo3SwCP1-2wyQtV5BfGbxvOTKG012sbCPbNlRe-ay82MaTmHbT1ComA1CXT3Wv_Q/exec";

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let allData = {}; 
        let lastActiveCell = null; 
        let lastClickedItem = null; 
        let currentView = 'calendar';
        let monthlyChartInstance = null;
        let breathChartInstance = null; 
        
        // Флаг, чтобы блокировать клики во время анимации
        let isAnimating = false; 

        function vibrate(type) {
            if (tg.HapticFeedback) {
                if (type === 'light') tg.HapticFeedback.impactOccurred('light');
                if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function toggleFab(e) {
            if (e.target.id === 'fabContainer' || e.target.classList.contains('fab-plus')) {
                vibrate('light');
                const fab = document.getElementById('fabContainer');
                if (isAnimating) return; // Если идет анимация, не открываем меню
                fab.classList.toggle('expanded');
            }
        }

        document.addEventListener('click', function(event) {
            const fab = document.getElementById('fabContainer');
            if (fab.classList.contains('expanded') && !fab.contains(event.target)) {
                fab.classList.remove('expanded');
            }
        });

        function switchToView(targetView, e) {
            if(e) e.stopPropagation(); 
            
            // Если уже идет анимация — игнорируем любые клики
            if (isAnimating) return;
            
            vibrate('medium');
            
            const fab = document.getElementById('fabContainer');
            fab.classList.remove('expanded');

            if (currentView === targetView) {
                showToast("Вы уже находитесь здесь");
                return;
            }

            // ВКЛЮЧАЕМ БЛОКИРОВКУ
            isAnimating = true;
            document.body.classList.add('locked'); // Блокируем клики на всем экране

            const incomingView = targetView === 'graph' ? document.getElementById('graphView') : document.getElementById('calendarView');
            const outgoingView = targetView === 'graph' ? document.getElementById('calendarView') : document.getElementById('graphView');

            const rect = fab.getBoundingClientRect();

            incomingView.style.zIndex = '20';
            outgoingView.style.zIndex = '10';

            incomingView.style.opacity = '1';
            incomingView.style.transition = 'none';
            incomingView.style.clipPath = `inset(${rect.top}px ${window.innerWidth - rect.right}px ${window.innerHeight - rect.bottom}px ${rect.left}px round 28px)`;
            
            outgoingView.style.transition = 'none';
            outgoingView.style.clipPath = `inset(0px 0px 0px 0px round 0px)`;

            incomingView.offsetHeight; 

            setTimeout(() => {
                incomingView.style.transition = 'clip-path 0.6s var(--ios-spring)';
                incomingView.style.clipPath = `inset(0px 0px 0px 0px round 0px)`;
            }, 10);

            currentView = targetView;
            if (targetView === 'graph') renderMonthlyGraph();

            // ВЫКЛЮЧАЕМ БЛОКИРОВКУ ПОСЛЕ ЗАВЕРШЕНИЯ
            setTimeout(() => {
                incomingView.classList.add('active');
                outgoingView.classList.remove('active');
                incomingView.style.zIndex = '10';
                incomingView.style.transition = '';
                
                document.body.classList.remove('locked'); // Разблокируем экран
                isAnimating = false; // Снимаем флаг
            }, 650); 
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        async function loadData() {
            try {
                const response = await fetch(scriptUrl + "?action=getData");
                const data = await response.json(); 
                for (let i = 1; i < data.length; i++) {
                    const dateObj = new Date(data[i][0]); 
                    const flow = parseFloat(data[i][1]); 
                    const curveString = data[i][2]; 
                    if (isNaN(flow)) continue; 
                    
                    const dateKey = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
                    const timeStr = String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0') + ':' + String(dateObj.getSeconds()).padStart(2, '0');
                    
                    if (!allData[dateKey]) allData[dateKey] = [];
                    allData[dateKey].push({ time: timeStr, flow: flow, curve: curveString });
                }
                renderCalendar();
                if(currentView === 'graph') renderMonthlyGraph();
            } catch (error) {
                console.error("Ошибка загрузки", error);
            }
        }

        function renderCalendar() {
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('monthTitle').innerText = monthNames[currentMonth] + " " + currentYear;
            document.getElementById('monthTitleGraph').innerText = monthNames[currentMonth] + " " + currentYear;
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = ''; 
            let firstDay = new Date(currentYear, currentMonth, 1).getDay();
            let startDay = firstDay === 0 ? 7 : firstDay; 
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            for (let i = 1; i < startDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day-cell empty-cell';
                grid.appendChild(emptyDiv);
            }
            
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) cell.classList.add('today');
                
                const dateKey = currentYear + '-' + String(currentMonth+1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const measurements = allData[dateKey] || [];
                
                if (measurements.length > 0) {
                    const maxFlow = Math.max(...measurements.map(m => m.flow));
                    cell.innerHTML = `<span class="day-num">${day}</span><span class="day-val">${maxFlow.toFixed(1)}</span>`;
                } else {
                    cell.innerHTML = `<span class="day-num">${day}</span>`;
                }
                
                cell.addEventListener('click', function() { openExpandedView(this, day, measurements); });
                grid.appendChild(cell);
            }
        }

        function renderMonthlyGraph() {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            let labels = [];
            let dataPoints = [];

            for (let day = 1; day <= daysInMonth; day++) {
                labels.push(day);
                const dateKey = currentYear + '-' + String(currentMonth+1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const measurements = allData[dateKey];
                
                if (measurements && measurements.length > 0) {
                    const maxFlow = Math.max(...measurements.map(m => m.flow));
                    dataPoints.push(maxFlow);
                } else {
                    dataPoints.push(null);
                }
            }

            if (monthlyChartInstance) monthlyChartInstance.destroy();

            monthlyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Макс. поток',
                        data: dataPoints,
                        borderColor: '#0A84FF',
                        backgroundColor: 'rgba(10, 132, 255, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#0A84FF',
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.4,
                        spanGaps: true, 
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) { return context.parsed.y + ' л/мин'; }
                            }
                        },
                        zoom: {
                            pan: { enabled: true, mode: 'xy', threshold: 10 },
                            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'xy' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#8E8E93', stepSize: 1, autoSkip: false, maxRotation: 90, minRotation: 90, font: {size: 11} },
                            grid: { display: false }
                        },
                        y: {
                            min: 0, max: 1000,
                            ticks: { color: '#8E8E93', stepSize: 50, font: {size: 11} },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        }
                    }
                }
            });
        }

        function openExpandedView(cell, day, measurements) {
            vibrate('medium');
            lastActiveCell = cell;
            
            const rect = cell.getBoundingClientRect();
            const modal = document.getElementById('modalContent');
            const view = document.getElementById('expandedView');
            const inner = document.getElementById('modalInner');
            
            inner.style.transition = 'none';
            inner.style.opacity = '0';
            
            const modalRect = modal.getBoundingClientRect();
            const insetTop = rect.top - modalRect.top;
            const insetBottom = modalRect.bottom - rect.bottom;
            const insetLeft = rect.left - modalRect.left;
            const insetRight = modalRect.right - rect.right;
            
            modal.style.transition = 'none';
            modal.style.clipPath = `inset(${insetTop}px ${insetRight}px ${insetBottom}px ${insetLeft}px round 18px)`;
            
            const monthNames = ["Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"];
            document.getElementById('sheetDateTitle').innerText = `${day} ${monthNames[currentMonth]}`;
            
            const list = document.getElementById('measurementList');
            list.innerHTML = ''; 
            
            if (measurements.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#8E8E93; margin-top:20px; font-size:15px;">Нет данных за этот день</div>`;
            } else {
                measurements.sort((a, b) => a.time.localeCompare(b.time));
                measurements.forEach((m) => {
                    const item = document.createElement('div');
                    item.className = 'measurement-item';
                    item.addEventListener('click', function() { 
                        vibrate('light'); 
                        showGraph(m, this); 
                    });
                    item.innerHTML = `<span class="m-time">🕒 ${m.time}</span><span class="m-value">${m.flow.toFixed(2)} л/м</span>`;
                    list.appendChild(item);
                });
            }

            showListView(true); 
            view.classList.add('active');

            modal.offsetHeight; 
            
            setTimeout(() => {
                modal.style.transition = 'clip-path 0.6s var(--ios-spring)';
                modal.style.clipPath = `inset(0px 0px 0px 0px round 24px)`; 
            }, 10);

            setTimeout(() => {
                inner.style.transition = 'opacity 0.3s';
                inner.style.opacity = '1';
            }, 600);
        }

        function closeExpandedView() {
            vibrate('light');
            const view = document.getElementById('expandedView');
            const modal = document.getElementById('modalContent');
            const inner = document.getElementById('modalInner');
            
            inner.style.transition = 'none';
            inner.style.opacity = '0';
            
            if (lastActiveCell) {
                const rect = lastActiveCell.getBoundingClientRect();
                const modalRect = modal.getBoundingClientRect();
                
                const insetTop = rect.top - modalRect.top;
                const insetBottom = modalRect.bottom - rect.bottom;
                const insetLeft = rect.left - modalRect.left;
                const insetRight = modalRect.right - rect.right;
                
                modal.style.transition = 'clip-path 0.6s var(--ios-spring)';
                modal.style.clipPath = `inset(${insetTop}px ${insetRight}px ${insetBottom}px ${insetLeft}px round 18px)`;
            } else {
                modal.style.clipPath = `inset(50% 50% 50% 50% round 24px)`;
            }
            
            view.classList.remove('active');
            
            setTimeout(() => { 
                if (breathChartInstance) { breathChartInstance.destroy(); breathChartInstance = null; } 
            }, 650);
        }

        function showListView(instant = false) {
            const list = document.getElementById('listView');
            const graph = document.getElementById('graphContainer');
            const wrapper = document.getElementById('innerViewsWrapper');
            
            list.style.display = 'flex';
            if (!instant) {
                list.style.opacity = '0';
            } else {
                list.style.opacity = '1';
            }
            
            if (instant || !lastClickedItem) {
                graph.style.transition = 'none';
                graph.style.display = 'none';
                graph.style.clipPath = `inset(50% 50% 50% 50% round 16px)`;
                if (breathChartInstance) { breathChartInstance.destroy(); breathChartInstance = null; }
                return;
            }

            const itemRect = lastClickedItem.getBoundingClientRect();
            const wrapperRect = wrapper.getBoundingClientRect();

            const insetTop = itemRect.top - wrapperRect.top;
            const insetBottom = wrapperRect.bottom - itemRect.bottom;
            const insetLeft = itemRect.left - wrapperRect.left;
            const insetRight = wrapperRect.right - itemRect.right;

            graph.style.transition = 'clip-path 0.5s var(--ios-spring), opacity 0.2s';
            graph.style.clipPath = `inset(${insetTop}px ${insetRight}px ${insetBottom}px ${insetLeft}px round 16px)`;
            graph.style.opacity = '0';

            setTimeout(() => {
                list.style.transition = 'opacity 0.2s';
                list.style.opacity = '1';
            }, 100);

            setTimeout(() => {
                graph.style.display = 'none';
                if (breathChartInstance) { breathChartInstance.destroy(); breathChartInstance = null; }
            }, 550); 
        }

        function showGraph(measurement, itemElement) {
            lastClickedItem = itemElement;
            
            const graph = document.getElementById('graphContainer');
            const list = document.getElementById('listView');
            const wrapper = document.getElementById('innerViewsWrapper');
            
            list.style.transition = 'opacity 0.2s';
            list.style.opacity = '0';
            list.style.pointerEvents = 'none';
            
            graph.style.display = 'flex';
            graph.style.opacity = '0'; 
            
            const itemRect = itemElement.getBoundingClientRect();
            const wrapperRect = wrapper.getBoundingClientRect();

            const insetTop = itemRect.top - wrapperRect.top;
            const insetBottom = wrapperRect.bottom - itemRect.bottom;
            const insetLeft = itemRect.left - wrapperRect.left;
            const insetRight = wrapperRect.right - itemRect.right;

            graph.style.transition = 'none';
            graph.style.clipPath = `inset(${insetTop}px ${insetRight}px ${insetBottom}px ${insetLeft}px round 16px)`;
            
            document.getElementById('graphTitle').innerText = `Замер в ${measurement.time}`;
            
            const ctx = document.getElementById('breathChart').getContext('2d');
            let labels = [];
            let dataPoints = [];
            
            if (measurement.curve && measurement.curve !== "undefined" && measurement.curve !== "") {
                let realCurve = JSON.parse(measurement.curve);
                for (let i = 0; i < realCurve.length; i++) {
                    labels.push((i * 0.05).toFixed(2) + 'с');
                    dataPoints.push(realCurve[i]);
                }
            } else {
                const peak = measurement.flow; 
                for (let i = 0; i <= 30; i++) {
                    const t = i * 0.08; 
                    labels.push(t.toFixed(1) + 'с');
                    let val = peak * 1.415 * Math.sin(t * Math.PI / 1.5) * Math.exp(-t * 0.5);
                    if (val < 0) val = 0; 
                    dataPoints.push(val.toFixed(1));
                }
            }

            if (breathChartInstance) breathChartInstance.destroy(); 
            
            breathChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ 
                        label: 'Поток', 
                        data: dataPoints, 
                        borderColor: '#0A84FF', 
                        backgroundColor: 'rgba(10, 132, 255, 0.2)', 
                        borderWidth: 3, 
                        pointRadius: 0, 
                        pointHoverRadius: 6, 
                        tension: 0.4, 
                        fill: true 
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, 
                    plugins: { legend: { display: false } }, 
                    scales: { 
                        x: { ticks: { color: '#8E8E93' }, grid: { display: false } }, 
                        y: { ticks: { color: '#8E8E93' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true } 
                    }
                }
            });

            graph.offsetHeight; 
            
            setTimeout(() => {
                graph.style.transition = 'clip-path 0.5s var(--ios-spring), opacity 0.2s';
                graph.style.clipPath = `inset(0px 0px 0px 0px round 0px)`;
                graph.style.opacity = '1';
            }, 10);

            setTimeout(() => {
                list.style.display = 'none';
            }, 500);
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar();
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar();
        });
        document.getElementById('prevMonthGraph').addEventListener('click', () => {
            currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); renderMonthlyGraph();
        });
        document.getElementById('nextMonthGraph').addEventListener('click', () => {
            currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); renderMonthlyGraph();
        });

        loadData();
    </script>
</body>
</html>
