<!-- ================= НАЧАЛО КОДА (ВЕРСИЯ 13.7 - EXPANDABLE BREATH INTENSITY CHART) ================= -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <style>
        :root {
            --bg: #050505;
            --text: #ffffff;
            --text-secondary: #8E8E93;
            --blue: #0A84FF;
            --green: #30D158;
            --orange: #FF9F0A;
            --red: #FF453A;
            --glass: rgba(24, 24, 26, 0.9);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --spring: cubic-bezier(0.32, 0.72, 0, 1);
            --spring-bounce: cubic-bezier(0.34, 1.45, 0.64, 1);
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px; overflow: hidden; height: 100vh; box-sizing: border-box;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; 
        }

        #core {
            position: fixed; top: 50%; left: 50%; width: 380px; height: 380px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.22) 0%, rgba(48, 209, 88, 0.05) 45%, rgba(0, 0, 0, 0) 72%);
            border-radius: 50%;
            z-index: 0; pointer-events: none;
            animation: coreFloat 7s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        @keyframes coreFloat {
            0% { transform: translate3d(-52%, -48%, 0) scale(0.92); opacity: 0.65; }
            50% { transform: translate3d(-48%, -52%, 0) scale(1.08); opacity: 0.95; }
            100% { transform: translate3d(-50%, -49%, 0) scale(0.96); opacity: 0.75; }
        }

        .view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; pointer-events: none; 
            transform: translate3d(0, 16px, 0) scale(0.97);
            transition: opacity 0.36s var(--spring), transform 0.48s var(--spring); 
            padding: 20px; box-sizing: border-box; z-index: 1;
            will-change: opacity, transform;
        }
        .view.active { 
            opacity: 1; pointer-events: auto; z-index: 10; 
            transform: translate3d(0, 0, 0) scale(1);
        }

        #dayView {
            overflow-y: auto;
            padding-bottom: 110px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            contain: content;
        }
        #dayView::-webkit-scrollbar { display: none; }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header button { 
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text); font-size: 18px; width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; 
            transition: background 0.2s, transform 0.32s var(--spring-bounce);
        }
        .header button:active { 
            background: rgba(255,255,255,0.22); 
            transform: scale(0.86); 
        }

        .header .refresh-glass-btn {
            width: auto; height: 36px; border-radius: 18px; padding: 0 14px;
            font-size: 14px; font-weight: 500; color: var(--blue);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .refresh-icon {
            display: inline-block;
            transition: transform 0.6s var(--spring);
        }
        .refresh-glass-btn.spinning .refresh-icon {
            transform: rotate(360deg);
        }

        .weekdays { 
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; 
            font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); font-size: 13px; 
            flex-shrink: 0;
        }
        .weekends { color: var(--red); }
        
        .calendar { 
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; 
            align-content: start; 
        }

        @keyframes popInCell {
            0% { opacity: 0; transform: translate3d(0, 8px, 0) scale(0.8); }
            100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        .day-cell { 
            aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 16px; position: relative; cursor: pointer;
            
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 10px rgba(0,0,0,0.22), inset 0 1px 1px rgba(255,255,255,0.1);
            
            animation: popInCell 0.42s var(--spring-bounce) backwards;
            transition: transform 0.28s var(--spring-bounce), background 0.18s;
            will-change: transform;
        }
        .day-cell:active { 
            transform: scale(0.85); 
            background: rgba(255,255,255,0.22); 
        }
        
        .day-cell.today { 
            background: linear-gradient(135deg, rgba(10, 132, 255, 0.36) 0%, rgba(10, 132, 255, 0.16) 100%); 
            border-top: 1px solid rgba(10, 132, 255, 0.6);
            border-left: 1px solid rgba(10, 132, 255, 0.38);
            box-shadow: 0 6px 16px rgba(10, 132, 255, 0.25), inset 0 1px 2px rgba(255,255,255,0.22);
        }
        
        .day-num { font-size: 17px; font-weight: 500; color: var(--text); }
        .day-val { font-size: 10px; font-weight: 600; position: absolute; bottom: 5px; }
        
        .val-green { color: var(--green); }
        .val-blue { color: var(--blue); }
        .day-cell.today .day-val { color: rgba(255,255,255,0.95); }

        .empty-cell { background: transparent; border: none; box-shadow: none; cursor: default; animation: none; }
        .empty-cell:active { transform: none; background: transparent; box-shadow: none; }

        /* =========================================
           ЭКРАН "ДЕНЬ"
           ========================================= */
        @keyframes slideUpGlass {
            0% { opacity: 0; transform: translate3d(0, 22px, 0) scale(0.96); }
            100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        .glass-card, .stat-box {
            background: linear-gradient(145deg, rgba(32, 33, 36, 0.85) 0%, rgba(18, 19, 21, 0.92) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: 0 8px 22px rgba(0,0,0,0.38), inset 0 1px 1px rgba(255,255,255,0.12);
            transition: transform 0.32s var(--spring-bounce);
            will-change: transform;
        }
        .glass-card:active, .stat-box:active {
            transform: scale(0.975);
        }

        .glass-card {
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 14px;
        }

        #dayView.active .anim-stagger-1 { animation: slideUpGlass 0.48s var(--spring) 0.02s backwards; }
        #dayView.active .anim-stagger-2 { animation: slideUpGlass 0.48s var(--spring) 0.07s backwards; }
        #dayView.active .anim-stagger-3 { animation: slideUpGlass 0.48s var(--spring) 0.12s backwards; }
        #dayView.active .anim-stagger-4 { animation: slideUpGlass 0.48s var(--spring) 0.17s backwards; }
        #dayView.active .anim-stagger-5 { animation: slideUpGlass 0.48s var(--spring) 0.22s backwards; }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-secondary);
        }

        .card-sub-hint {
            font-size: 11px; color: var(--text-secondary); font-weight: 500;
        }

        .glass-badge {
            font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
            border-top: 1px solid rgba(255,255,255,0.2);
            transition: background 0.35s ease, color 0.35s ease, transform 0.38s var(--spring-bounce);
        }
        .glass-badge.pulse { transform: scale(1.08); }
        .zone-green { background: rgba(48, 209, 88, 0.2); color: var(--green); }
        .zone-orange { background: rgba(255, 159, 10, 0.2); color: var(--orange); }
        .zone-red { background: rgba(255, 69, 58, 0.2); color: var(--red); }

        .hero-row {
            display: flex; align-items: baseline; gap: 6px; margin: 4px 0 8px;
        }
        .hero-value {
            font-size: 48px; font-weight: 700; letter-spacing: -1.5px; line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .hero-unit {
            font-size: 16px; font-weight: 500; color: var(--text-secondary);
        }
        .hero-meta {
            font-size: 13px; color: var(--text-secondary);
        }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
        }
        .stat-box {
            border-radius: 18px;
            padding: 14px;
        }
        .stat-num {
            font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .glass-segmented {
            position: relative;
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 12px;
        }
        .seg-pill {
            position: absolute;
            top: 3px; bottom: 3px; left: 3px;
            width: calc((100% - 6px) / 3);
            background: rgba(255, 255, 255, 0.18);
            border-top: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 9px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.28);
            transition: transform 0.38s var(--spring-bounce);
            will-change: transform;
            pointer-events: none;
        }
        .glass-segmented button {
            position: relative; z-index: 1;
            flex: 1; border: none; background: transparent; color: var(--text-secondary);
            font-size: 12px; font-weight: 600; padding: 6px 0; border-radius: 9px;
            cursor: pointer; transition: color 0.25s ease, transform 0.2s;
        }
        .glass-segmented button:active { transform: scale(0.93); }
        .glass-segmented button.active { color: var(--text); }

        .chart-wrap-day {
            height: 150px; position: relative;
        }

        .section-label {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-secondary); margin: 4px 0 8px 4px;
        }

        .day-list {
            display: flex; flex-direction: column; gap: 8px;
        }

        /* =========================================
           РАСКРЫВАЮЩАЯСЯ СТРОКА ЗАМЕРА (АККОРДЕОН С ГРАФИКОМ ИНТЕНСИВНОСТИ)
           ========================================= */
        .measurement-item { 
            background: linear-gradient(145deg, rgba(32, 33, 36, 0.85) 0%, rgba(18, 19, 21, 0.92) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            padding: 15px 16px; border-radius: 16px; display: flex; flex-direction: column;
            flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.16);
            cursor: pointer;
            animation: slideUpGlass 0.38s var(--spring) backwards;
            transition: transform 0.26s var(--spring-bounce), background 0.2s, border-color 0.25s;
            will-change: transform;
        }
        .measurement-item:active {
            transform: scale(0.975);
        }
        .measurement-item.open {
            background: linear-gradient(145deg, rgba(38, 40, 46, 0.94) 0%, rgba(22, 23, 27, 0.96) 100%);
            border-top: 1px solid rgba(10, 132, 255, 0.45);
        }

        .m-top-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }
        .m-right-wrap {
            display: flex; align-items: center; gap: 8px;
        }
        .m-chevron {
            font-size: 11px; color: var(--text-secondary);
            transition: transform 0.35s var(--spring-bounce), color 0.2s;
        }
        .measurement-item.open .m-chevron {
            transform: rotate(180deg);
            color: var(--blue);
        }

        .m-expand-body {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            margin-top: 0;
            transition: grid-template-rows 0.42s var(--spring), opacity 0.28s ease, margin-top 0.35s var(--spring);
        }
        .measurement-item.open .m-expand-body {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 12px;
        }
        .m-expand-inner {
            overflow: hidden;
        }
        .m-chart-box {
            height: 120px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 8px 10px 4px;
            position: relative;
        }
        .m-chart-caption {
            display: flex; justify-content: space-between;
            font-size: 11px; color: var(--text-secondary);
            margin-top: 6px; padding: 0 2px;
        }

        .m-time { color: var(--text-secondary); font-size: 15px; font-weight: 500; }
        .m-value { font-size: 17px; font-weight: 600; }

        /* =========================================
           FAB МЕНЮ СЛЕВА СНИЗУ
           ========================================= */
        #fabContainer {
            position: fixed; bottom: 30px; left: 20px;
            width: 56px; height: 56px;
            background: rgba(34, 35, 38, 0.82);
            backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 10px 32px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.2);
            border-radius: 28px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: width 0.45s var(--spring-bounce), height 0.45s var(--spring-bounce), border-radius 0.42s var(--spring), background 0.25s, transform 0.25s var(--spring-bounce);
            z-index: 500; overflow: hidden; cursor: pointer;
            will-change: width, height, transform;
        }
        
        #fabContainer:not(.expanded):active { transform: scale(0.86); }

        #fabContainer.expanded {
            width: 152px; height: 162px; border-radius: 26px;
            background: rgba(28, 28, 30, 0.92);
            box-shadow: 0 18px 44px rgba(0,0,0,0.65), inset 0 1px 1px rgba(255,255,255,0.22);
            cursor: default;
        }

        .fab-plus { 
            position: absolute; font-size: 32px; font-weight: 300; color: white; 
            transition: opacity 0.2s, transform 0.38s var(--spring-bounce); 
        }
        #fabContainer.expanded .fab-plus { opacity: 0; transform: rotate(135deg) scale(0.3); pointer-events: none; }

        .fab-menu-content {
            display: flex; flex-direction: column; gap: 7px; width: 100%; padding: 12px; box-sizing: border-box;
            opacity: 0; pointer-events: none; transform: translate3d(0, 10px, 0) scale(0.86);
            transition: opacity 0.2s, transform 0.42s var(--spring-bounce);
        }
        
        #fabContainer.expanded .fab-menu-content { 
            opacity: 1; pointer-events: auto; 
            transform: translate3d(0, 0, 0) scale(1); transition-delay: 0.04s; 
        }

        .fab-action-btn {
            background: rgba(255,255,255,0.08); border: none; padding: 10px 14px; border-radius: 13px; color: white;
            display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 500;
            border-top: 1px solid rgba(255,255,255,0.12);
            cursor: pointer; 
            opacity: 0; transform: translate3d(-10px, 0, 0);
            transition: background 0.18s, transform 0.32s var(--spring-bounce), opacity 0.22s; 
            width: 100%;
        }
        #fabContainer.expanded .fab-action-btn { opacity: 1; transform: translate3d(0, 0, 0); }
        #fabContainer.expanded .fab-action-btn:nth-child(1) { transition-delay: 0.05s; }
        #fabContainer.expanded .fab-action-btn:nth-child(2) { transition-delay: 0.09s; }
        #fabContainer.expanded .fab-action-btn:nth-child(3) { transition-delay: 0.13s; }

        .fab-action-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93) !important; }

        /* =========================================
           МОДАЛЬНОЕ ОКНО ДНЯ (МОРФИНГ)
           ========================================= */
        #expandedView { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; 
            pointer-events: none; opacity: 0; transition: opacity 0.32s var(--spring); 
        }
        
        #expandedView::before { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.58); 
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); 
            opacity: 0; transition: opacity 0.35s var(--spring); 
        }
        
        #modalContent {
            position: absolute;
            top: 8vh; bottom: 8vh; left: 18px; right: 18px;
            background: var(--glass);
            backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%);
            border-radius: 26px; 
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            box-shadow: 0 28px 56px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.14);
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow: hidden;
            clip-path: inset(50% 50% 50% 50% round 16px); 
            transition: clip-path 0.62s var(--spring);
            will-change: clip-path;
            transform: translateZ(0);
        }
        
        #expandedView.active { pointer-events: auto; opacity: 1; }
        #expandedView.active::before { opacity: 1; }
        
        .expanded-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-shrink: 0; }
        .expanded-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
        .close-btn { 
            background: rgba(255,255,255,0.12); border: none; color: var(--text); 
            font-size: 18px; width: 32px; height: 32px; border-radius: 50%; 
            cursor: pointer; display: flex; justify-content: center; align-items: center; 
            transition: background 0.2s, transform 0.3s var(--spring-bounce);
            border-top: 1px solid rgba(255,255,255,0.22);
        }
        .close-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.84) rotate(90deg); }
        
        #modalInner {
            display: flex; flex-direction: column; height: 100%; min-height: 0;
            opacity: 0; transform: translate3d(0, 8px, 0) scale(0.95);
            transition: opacity 0.25s ease, transform 0.38s var(--spring);
        }
        #expandedView.active #modalInner {
            opacity: 1; transform: translate3d(0, 0, 0) scale(1);
            transition-delay: 0.12s;
        }

        #measurementList { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; 
            -webkit-overflow-scrolling: touch; scrollbar-width: none; 
        }
        #measurementList::-webkit-scrollbar { display: none; }

        .chart-container { 
            flex: 1; position: relative; width: 100%; height: 100%; 
            background: rgba(24, 24, 26, 0.85);
            border-radius: 22px; padding: 15px; 
            box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06);
            border-top: 1px solid rgba(255,255,255,0.18);
        }
    </style>
</head>
<body>
    <div id="core"></div>

    <!-- КАЛЕНДАРЬ (ЧИСТАЯ ШАПКА БЕЗ КНОПКИ ГРАФИКА СПРАВА СВЕРХУ) -->
    <div id="calendarView" class="view active">
        <div class="header">
            <button id="prevBtn">&#8249;</button>
            <span id="monthTitle"></span>
            <button id="nextBtn">&#8250;</button>
        </div>
        <div class="weekdays">
            <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div class="weekends">СБ</div><div class="weekends">ВС</div>
        </div>
        <div class="calendar" id="calendarGrid"></div>
    </div>

    <!-- МЕСЯЧНЫЙ ГРАФИК -->
    <div id="graphView" class="view">
        <div class="header">
            <button id="prevMonthGraph">&#8249;</button>
            <span id="monthTitleGraph"></span>
            <button id="nextMonthGraph">&#8250;</button>
        </div>
        <div class="chart-container">
            <canvas id="monthlyChart"></canvas>
        </div>
    </div>

    <!-- ДЕНЬ (LIQUID GLASS) -->
    <div id="dayView" class="view">
        <div class="header">
            <span>День</span>
            <button id="refreshDayBtn" class="refresh-glass-btn" onclick="loadData(true)"><span class="refresh-icon">↻</span> Обновить</button>
        </div>

        <div class="glass-card anim-stagger-1">
            <div class="card-header">
                <span class="card-title">Последний выдох</span>
                <span id="zoneBadge" class="glass-badge zone-green">Норма</span>
            </div>
            <div class="hero-row">
                <span id="lastFlow" class="hero-value">—</span>
                <span class="hero-unit">л/мин</span>
            </div>
            <div id="lastTime" class="hero-meta">Загрузка данных с ESP32...</div>
        </div>

        <div class="stats-grid anim-stagger-2">
            <div class="stat-box">
                <div class="card-title">Лучший (норма)</div>
                <div class="stat-num"><span id="bestFlowNum">400</span> <span style="font-size:13px;font-weight:500;color:var(--text-secondary)">л/м</span></div>
            </div>
            <div class="stat-box">
                <div class="card-title">Средний пик</div>
                <div class="stat-num"><span id="avgFlowNum">—</span> <span style="font-size:13px;font-weight:500;color:var(--text-secondary)">л/м</span></div>
            </div>
        </div>

        <!-- ГРАФИК ИНТЕНСИВНОСТИ ВЫБРАННОГО / ПОСЛЕДНЕГО ВЫДОХА -->
        <div class="glass-card anim-stagger-3">
            <div class="card-header">
                <span class="card-title">Интенсивность выдоха</span>
                <span id="intensityMeta" class="card-sub-hint">Последний замер</span>
            </div>
            <div class="chart-wrap-day" style="height:135px">
                <canvas id="intensityMainChart"></canvas>
            </div>
        </div>

        <!-- ДИНАМИКА ПИКОВ -->
        <div class="glass-card anim-stagger-4">
            <div class="card-header">
                <span class="card-title">Динамика ПСВ</span>
            </div>
            <div class="glass-segmented">
                <div id="segPill" class="seg-pill"></div>
                <button class="active" onclick="setDayRange(7, 0, this)">7 замеров</button>
                <button onclick="setDayRange(20, 1, this)">20 замеров</button>
                <button onclick="setDayRange(100, 2, this)">Все</button>
            </div>
            <div class="chart-wrap-day">
                <canvas id="dayChart"></canvas>
            </div>
        </div>

        <div class="section-label anim-stagger-5">Последние замеры (нажми для графика)</div>
        <div id="dayHistoryList" class="day-list anim-stagger-5"></div>
    </div>

    <!-- FAB МЕНЮ -->
    <div id="fabContainer" onclick="toggleFab(event)">
        <div class="fab-plus">+</div>
        <div class="fab-menu-content">
            <button class="fab-action-btn" onclick="switchToView('day', event)">📊 День</button>
            <button class="fab-action-btn" onclick="switchToView('graph', event)">📈 График</button>
            <button class="fab-action-btn" onclick="switchToView('calendar', event)">📅 Календарь</button>
        </div>
    </div>

    <!-- МОДАЛКА ДНЯ -->
    <div id="expandedView" onclick="closeExpandedView()">
        <div id="modalContent" onclick="event.stopPropagation()">
            <div id="modalInner">
                <div class="expanded-header">
                    <div class="expanded-title" id="sheetDateTitle">Дата</div>
                    <button class="close-btn" onclick="closeExpandedView()">×</button>
                </div>
                <div id="measurementList"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxh0Poo3SwCP1-2wyQtV5BfGbxvOTKG012sbCPbNlRe-ay82MaTmHbT1ComA1CXT3Wv_Q/exec";
        const PERSONAL_BEST = 400;

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let allData = {};
        let flatRecords = [];
        let monthlyChartInstance = null;
        let dayChartInstance = null;
        let intensityMainChartInstance = null;
        let inlineCharts = {};
        let dayRangeLimit = 7;
        let currentView = 'calendar';
        let lastMorphInset = 'inset(50% 50% 50% 50% round 16px)';

        function haptic(type = 'light') {
            if (!tg?.HapticFeedback) return;
            if (type === 'selection') tg.HapticFeedback.selectionChanged();
            else tg.HapticFeedback.impactOccurred(type);
        }

        function animateValue(el, target, duration = 550) {
            const start = Number(el.innerText) || 0;
            if (start === target) { el.innerText = target; return; }
            const startTime = performance.now();
            function step(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 4);
                el.innerText = Math.round(start + (target - start) * ease);
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function parseAnyDate(raw) {
            if (!raw) return null;
            let d = new Date(raw);
            if (!isNaN(d.getTime())) return d;

            const str = String(raw).trim();
            const m = str.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:[,\s]+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
            if (m) {
                return new Date(
                    Number(m[3]),
                    Number(m[2]) - 1,
                    Number(m[1]),
                    Number(m[4] || 0),
                    Number(m[5] || 0),
                    Number(m[6] || 0)
                );
            }
            return null;
        }

        // Парсим массив точек выдоха с ESP32 (из 3-го столбца таблицы), либо строим плавную кривую по пику
        function parsePoints(rawPoints, peakFlow) {
            if (Array.isArray(rawPoints) && rawPoints.length >= 2) {
                return rawPoints.map(Number).filter(n => !isNaN(n));
            }
            if (typeof rawPoints === 'string' && rawPoints.trim().startsWith('[')) {
                try {
                    const arr = JSON.parse(rawPoints);
                    if (Array.isArray(arr) && arr.length >= 2) {
                        return arr.map(Number).filter(n => !isNaN(n));
                    }
                } catch (e) {}
            }
            // Если это старый замер без массива точек — синтезируем реалистичный профиль выдоха до peakFlow
            const p = Math.round(peakFlow);
            return [
                Math.round(p * 0.18),
                Math.round(p * 0.62),
                Math.round(p * 0.94),
                p,
                Math.round(p * 0.88),
                Math.round(p * 0.72),
                Math.round(p * 0.54),
                Math.round(p * 0.36),
                Math.round(p * 0.21),
                Math.round(p * 0.08)
            ];
        }

        function buildIntensityLabels(count) {
            return Array.from({ length: count }, (_, i) => ((i * 0.05).toFixed(2) + 'с'));
        }

        function drawIntensityChart(canvasEl, points, color, existingChart = null) {
            // Обрезаем хвостовые нули, если выдох закончился раньше 3 сек
            let trimmed = [...points];
            while (trimmed.length > 8 && trimmed[trimmed.length - 1] === 0 && trimmed[trimmed.length - 2] === 0) {
                trimmed.pop();
            }
            const labels = buildIntensityLabels(trimmed.length);

            if (existingChart) {
                existingChart.data.labels = labels;
                existingChart.data.datasets[0].data = trimmed;
                existingChart.data.datasets[0].borderColor = color;
                existingChart.data.datasets[0].backgroundColor = color + '28';
                existingChart.update();
                return existingChart;
            }

            return new Chart(canvasEl.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: trimmed,
                        borderColor: color,
                        backgroundColor: color + '28',
                        borderWidth: 2.5,
                        pointRadius: 0,
                        pointHitRadius: 10,
                        fill: true,
                        tension: 0.42
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 480, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            ticks: { color: '#8E8E93', font: { size: 9 }, maxTicksLimit: 6 },
                            grid: { display: false }
                        },
                        y: {
                            min: 0,
                            ticks: { color: '#8E8E93', font: { size: 10 }, maxTicksLimit: 4 },
                            grid: { color: 'rgba(255,255,255,0.06)' }
                        }
                    }
                }
            });
        }

        function toggleFab(e) {
            if (e.target.id === 'fabContainer' || e.target.classList.contains('fab-plus')) {
                haptic('light');
                document.getElementById('fabContainer').classList.toggle('expanded');
            }
        }

        document.addEventListener('click', function(event) {
            const fab = document.getElementById('fabContainer');
            if (fab.classList.contains('expanded') && !fab.contains(event.target)) {
                fab.classList.remove('expanded');
            }
        });

        function switchToView(target, e) {
            if(e) e.stopPropagation(); 
            document.getElementById('fabContainer').classList.remove('expanded');
            if (currentView === target) return;
            haptic('selection');

            document.getElementById('calendarView').classList.remove('active');
            document.getElementById('graphView').classList.remove('active');
            document.getElementById('dayView').classList.remove('active');

            if (target === 'graph') {
                document.getElementById('graphView').classList.add('active');
                currentView = 'graph';
                renderMonthlyGraph();
            } else if (target === 'day') {
                document.getElementById('dayView').classList.add('active');
                currentView = 'day';
                renderDayView(true);
            } else {
                document.getElementById('calendarView').classList.add('active');
                currentView = 'calendar';
                renderCalendar();
            }
        }

        async function loadData(withHaptic = false) {
            const btn = document.getElementById('refreshDayBtn');
            if (withHaptic) {
                haptic('medium');
                if (btn) {
                    btn.classList.remove('spinning');
                    void btn.offsetWidth;
                    btn.classList.add('spinning');
                }
            }
            document.getElementById('lastTime').innerText = 'Загрузка точек с ESP32...';
            try {
                const response = await fetch(scriptUrl + "?action=getData");
                const data = await response.json();
                allData = {};
                flatRecords = [];

                for (let i = 1; i < data.length; i++) {
                    const dateObj = parseAnyDate(data[i][0]); 
                    const flow = parseFloat(String(data[i][1]).replace(',', '.')); 
                    if (!dateObj || isNaN(flow) || flow <= 0 || flow > 600) continue; 
                    
                    const points = parsePoints(data[i][2], flow);
                    const dateKey = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
                    const timeStr = String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0') + ':' + String(dateObj.getSeconds()).padStart(2, '0');
                    const shortTime = String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0');
                    const fullDate = String(dateObj.getDate()).padStart(2, '0') + '.' + String(dateObj.getMonth()+1).padStart(2, '0') + ' • ' + shortTime;
                    const hour = dateObj.getHours();
                    
                    const rec = { ts: dateObj.getTime(), time: timeStr, fullDate: fullDate, shortTime: shortTime, flow: flow, hour: hour, points: points };
                    if (!allData[dateKey]) allData[dateKey] = [];
                    allData[dateKey].push(rec);
                    flatRecords.push(rec);
                }

                flatRecords.sort((a, b) => b.ts - a.ts);
                renderCalendar();
                if (currentView === 'graph') renderMonthlyGraph();
                renderDayView(true);
            } catch (error) {
                console.error("Ошибка загрузки", error);
                document.getElementById('lastTime').innerText = 'Ошибка загрузки';
                renderCalendar();
            }
        }

        function renderCalendar() {
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('monthTitle').innerText = monthNames[currentMonth] + " " + currentYear;
            document.getElementById('monthTitleGraph').innerText = monthNames[currentMonth] + " " + currentYear;
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = ''; 
            let firstDay = new Date(currentYear, currentMonth, 1).getDay();
            let startDay = firstDay === 0 ? 7 : firstDay; 
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            for (let i = 1; i < startDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day-cell empty-cell';
                grid.appendChild(emptyDiv);
            }
            
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.style.animationDelay = `${Math.min(day * 0.01, 0.3)}s`;
                if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) cell.classList.add('today');
                
                const dateKey = currentYear + '-' + String(currentMonth+1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const measurements = allData[dateKey] || [];
                
                if (measurements.length > 0) {
                    const maxFlow = Math.max(...measurements.map(m => m.flow));
                    const colorClass = maxFlow <= 12 ? 'val-green' : 'val-blue';
                    cell.innerHTML = `<span class="day-num">${day}</span><span class="day-val ${colorClass}">${Math.round(maxFlow)}</span>`;
                } else {
                    cell.innerHTML = `<span class="day-num">${day}</span>`;
                }
                
                cell.addEventListener('click', function() { openModal(this, day, measurements); });
                grid.appendChild(cell);
            }
        }

        function renderMonthlyGraph() {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            let labels = [];
            let morningData = [];
            let eveningData = [];

            for (let day = 1; day <= daysInMonth; day++) {
                labels.push(day);
                const dateKey = currentYear + '-' + String(currentMonth+1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const measurements = allData[dateKey];
                
                if (measurements && measurements.length > 0) {
                    const morning = measurements.filter(m => m.hour < 12);
                    const evening = measurements.filter(m => m.hour >= 12);
                    morningData.push(morning.length > 0 ? Math.max(...morning.map(m => m.flow)) : null);
                    eveningData.push(evening.length > 0 ? Math.max(...evening.map(m => m.flow)) : null);
                } else {
                    morningData.push(null);
                    eveningData.push(null);
                }
            }

            if (monthlyChartInstance) monthlyChartInstance.destroy();

            monthlyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Утро',
                            data: morningData,
                            borderColor: '#30D158',
                            backgroundColor: 'rgba(48, 209, 88, 0.1)',
                            borderWidth: 3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#30D158',
                            tension: 0.4,
                            spanGaps: true,
                            fill: false
                        },
                        {
                            label: 'День/Вечер',
                            data: eveningData,
                            borderColor: '#0A84FF',
                            backgroundColor: 'rgba(10, 132, 255, 0.1)',
                            borderWidth: 3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#0A84FF',
                            tension: 0.4,
                            spanGaps: true,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 650, easing: 'easeOutQuart' },
                    plugins: { legend: { display: true, labels: { color: '#8E8E93' } } },
                    scales: {
                        x: { ticks: { color: '#8E8E93', stepSize: 1, autoSkip: false, maxRotation: 90, minRotation: 90 }, grid: { display: false } },
                        y: { min: 0, max: 500, ticks: { color: '#8E8E93', stepSize: 50 }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        function getZone(flow) {
            const pct = (flow / PERSONAL_BEST) * 100;
            if (pct >= 80) return { label: 'Зелёная зона', cls: 'zone-green', color: '#30D158' };
            if (pct >= 50) return { label: 'Жёлтая зона', cls: 'zone-orange', color: '#FF9F0A' };
            return { label: 'Красная зона', cls: 'zone-red', color: '#FF453A' };
        }

        // Создание раскрывающейся карточки замера с графиком интенсивности внутри
        function createExpandableMeasurementCard(m, labelText, delaySec, uid, onSelectCallback = null) {
            const z = getZone(m.flow);
            const item = document.createElement('div');
            item.className = 'measurement-item';
            item.style.animationDelay = `${delaySec}s`;

            const durationSec = (m.points.length * 0.05).toFixed(1);
            item.innerHTML = `
                <div class="m-top-row">
                    <span class="m-time">🕒 ${labelText}</span>
                    <div class="m-right-wrap">
                        <span class="m-value" style="color:${z.color}">${Math.round(m.flow)} л/м</span>
                        <span class="m-chevron">▾</span>
                    </div>
                </div>
                <div class="m-expand-body">
                    <div class="m-expand-inner">
                        <div class="m-chart-box">
                            <canvas id="canvas_${uid}"></canvas>
                        </div>
                        <div class="m-chart-caption">
                            <span>Пик: ${Math.round(m.flow)} л/мин</span>
                            <span>Длительность: ~${durationSec} с</span>
                        </div>
                    </div>
                </div>
            `;

            item.addEventListener('click', () => {
                haptic('selection');
                const wasOpen = item.classList.contains('open');

                // Закрываем остальные открытые карточки в этом списке
                item.parentElement.querySelectorAll('.measurement-item.open').forEach(el => {
                    el.classList.remove('open');
                });

                if (!wasOpen) {
                    item.classList.add('open');
                    const canvas = item.querySelector(`#canvas_${uid}`);
                    if (inlineCharts[uid]) {
                        inlineCharts[uid].destroy();
                    }
                    inlineCharts[uid] = drawIntensityChart(canvas, m.points, z.color);
                }

                if (onSelectCallback) {
                    onSelectCallback(m);
                }
            });

            return item;
        }

        function setDayRange(limit, index, btn) {
            if (dayRangeLimit === limit) return;
            haptic('selection');
            dayRangeLimit = limit;

            document.getElementById('segPill').style.transform = `translate3d(${index * 100}%, 0, 0)`;

            document.querySelectorAll('#dayView .glass-segmented button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDayChartOnly();
        }

        function updateDayChartOnly() {
            const slice = flatRecords.slice(0, dayRangeLimit).reverse();
            const labels = slice.map(r => r.shortTime);
            const values = slice.map(r => r.flow);
            const colors = slice.map(r => getZone(r.flow).color);

            if (dayChartInstance) {
                dayChartInstance.data.labels = labels;
                dayChartInstance.data.datasets[0].data = values;
                dayChartInstance.data.datasets[0].pointBackgroundColor = colors;
                dayChartInstance.update();
            }
        }

        function selectMainIntensityRecord(rec) {
            const z = getZone(rec.flow);
            document.getElementById('intensityMeta').innerText = `${rec.fullDate} • пик ${Math.round(rec.flow)} л/м`;
            const canvas = document.getElementById('intensityMainChart');
            intensityMainChartInstance = drawIntensityChart(canvas, rec.points, z.color, intensityMainChartInstance);
        }

        function renderDayView(withCounter = true) {
            const listEl = document.getElementById('dayHistoryList');
            if (!flatRecords.length) {
                document.getElementById('lastFlow').innerText = '0';
                document.getElementById('lastTime').innerText = 'Замеров в таблице пока нет';
                document.getElementById('avgFlowNum').innerText = '0';
                listEl.innerHTML = `<div style="text-align:center; color:#8E8E93; padding:16px; font-size:14px;">Нет данных</div>`;
                return;
            }

            const latest = flatRecords[0];
            const zone = getZone(latest.flow);
            const heroEl = document.getElementById('lastFlow');
            const bestEl = document.getElementById('bestFlowNum');
            const avgEl = document.getElementById('avgFlowNum');

            const bestVal = PERSONAL_BEST;
            const avgVal = Math.round(flatRecords.reduce((s, r) => s + r.flow, 0) / flatRecords.length);

            if (withCounter) {
                animateValue(heroEl, Math.round(latest.flow), 580);
                animateValue(bestEl, bestVal, 580);
                animateValue(avgEl, avgVal, 580);
            } else {
                heroEl.innerText = Math.round(latest.flow);
                bestEl.innerText = bestVal;
                avgEl.innerText = avgVal;
            }

            document.getElementById('lastTime').innerText = latest.fullDate;

            const badge = document.getElementById('zoneBadge');
            badge.innerText = zone.label;
            badge.className = 'glass-badge ' + zone.cls + ' pulse';
            setTimeout(() => badge.classList.remove('pulse'), 320);

            // Верхний график интенсивности на вкладке "День"
            selectMainIntensityRecord(latest);

            // Список последних замеров с раскрывающимся графиком интенсивности по тапу
            listEl.innerHTML = '';
            flatRecords.slice(0, 12).forEach((item, idx) => {
                const card = createExpandableMeasurementCard(
                    item,
                    item.fullDate,
                    Math.min(idx * 0.03, 0.35),
                    `day_${idx}`,
                    (selectedRec) => selectMainIntensityRecord(selectedRec)
                );
                listEl.appendChild(card);
            });

            const slice = flatRecords.slice(0, dayRangeLimit).reverse();
            const ctx = document.getElementById('dayChart').getContext('2d');

            if (dayChartInstance) {
                updateDayChartOnly();
                return;
            }

            dayChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: slice.map(r => r.shortTime),
                    datasets: [{
                        data: slice.map(r => r.flow),
                        borderColor: '#0A84FF',
                        backgroundColor: 'rgba(10, 132, 255, 0.16)',
                        borderWidth: 3,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: slice.map(r => getZone(r.flow).color),
                        pointBorderColor: '#fff',
                        fill: true,
                        tension: 0.42
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 550, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#8E8E93', font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: '#8E8E93', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
                    }
                }
            });
        }

        // --- МОДАЛЬНОЕ ОКНО ДНЯ (ТАП ПО СТРОКЕ ОТКРЫВАЕТ ГРАФИК ИНТЕНСИВНОСТИ) ---
        function openModal(cellElement, day, measurements) {
            haptic('light');
            const monthNames = ["Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"];
            document.getElementById('sheetDateTitle').innerText = `${day} ${monthNames[currentMonth]}`;
            
            const list = document.getElementById('measurementList');
            list.innerHTML = ''; 
            
            if (measurements.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#8E8E93; margin-top:20px; font-size:15px;">Нет данных</div>`;
            } else {
                const sorted = [...measurements].sort((a, b) => a.time.localeCompare(b.time));
                sorted.forEach((m, idx) => {
                    const card = createExpandableMeasurementCard(
                        m,
                        m.time,
                        0.12 + idx * 0.035,
                        `modal_${day}_${idx}`
                    );
                    list.appendChild(card);
                });
            }

            const rect = cellElement.getBoundingClientRect();
            const modal = document.getElementById('modalContent');
            const view = document.getElementById('expandedView');
            const modalRect = modal.getBoundingClientRect();
            
            const insetTop = rect.top - modalRect.top;
            const insetBottom = modalRect.bottom - rect.bottom;
            const insetLeft = rect.left - modalRect.left;
            const insetRight = modalRect.right - rect.right;
            
            lastMorphInset = `inset(${insetTop}px ${insetRight}px ${insetBottom}px ${insetLeft}px round 16px)`;

            modal.style.transition = 'none';
            modal.style.clipPath = lastMorphInset;
            
            view.classList.add('active');
            modal.offsetHeight; 
            
            requestAnimationFrame(() => {
                modal.style.transition = 'clip-path 0.62s var(--spring)';
                modal.style.clipPath = `inset(0px 0px 0px 0px round 26px)`; 
            });
        }

        function closeExpandedView() {
            haptic('light');
            const modal = document.getElementById('modalContent');
            const view = document.getElementById('expandedView');
            modal.style.transition = 'clip-path 0.48s var(--spring)';
            modal.style.clipPath = lastMorphInset;
            view.classList.remove('active');
        }

        document.getElementById('prevBtn').addEventListener('click', () => { haptic('selection'); currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); });
        document.getElementById('nextBtn').addEventListener('click', () => { haptic('selection'); currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); });
        document.getElementById('prevMonthGraph').addEventListener('click', () => { haptic('selection'); currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); renderMonthlyGraph(); });
        document.getElementById('nextMonthGraph').addEventListener('click', () => { haptic('selection'); currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); renderMonthlyGraph(); });

        loadData();
    </script>
</body>
</html>
